<!doctype html>
<meta charset="utf-8">
<title>restore test</title>
<script>
/* 一時的な検証用ページ：cc_ui_state を書いてアプリ本体へ戻るだけ。検証後に削除します。 */
var mode = (location.hash || "#dm").slice(1);
var st = { tab: "dm", openTid: "11111111-2222-3333-4444-555555555555", at: Date.now() };
if (mode === "profile") st = { tab: "profile", openTid: null, at: Date.now() };
if (mode === "search") st = { tab: "search", openTid: null, at: Date.now() };
if (mode === "bad") st = { tab: "nonsense", openTid: "not-a-uuid", at: Date.now() };
localStorage.setItem("cc_ui_state", JSON.stringify(st));
location.replace("./");
</script>

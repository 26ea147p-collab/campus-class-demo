<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>授業つながり（デモ版）</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1c2030;--sub:#6a7186;--ac:#3b5bdb;--ac2:#e7ecff;--bd:#e2e5ee;--ok:#2f9e6b;--err:#d9480f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--tx:#eceef6;--sub:#9aa1b8;--ac:#7c93ff;--ac2:#262c4a;--bd:#2c3040;--ok:#5fd3a0;--err:#ff8761;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;padding-bottom:76px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:4px 0 12px}h2{font-size:15px;margin:14px 0 8px}
.demo-bar{background:var(--ac2);color:var(--ac);font-size:12px;padding:8px 12px;border-radius:10px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.demo-bar button{padding:4px 10px;font-size:11px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.g{background:var(--ac2);color:var(--ac)}button.x{background:transparent;color:var(--sub);padding:4px 8px}
button.danger{background:rgba(217,72,15,0.12);color:var(--err)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin:2px 4px 2px 0}
.tag.ok{color:var(--ok);background:rgba(47,158,107,0.12)}.sub{color:var(--sub);font-size:12px}
.err{color:var(--err);font-size:12px;margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border-radius:0;background:transparent;color:var(--sub);padding:13px 4px}nav button.on{color:var(--ac)}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow-y:auto;margin:8px 0;padding:4px 0}
.m{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--ac2);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.m.me{background:var(--ac);color:#fff;align-self:flex-end}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.avatar{width:40px;height:40px;border-radius:99px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" style="display:none">
  <button data-t="search">さがす</button>
  <button data-t="dm">DM</button>
  <button data-t="profile">マイページ</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFKC").replace(/\s+/g,"").toLowerCase();
const GRADES=["S","A","B","C","D","未回答"], VIS={all:"全員に公開",same:"同じ授業の人のみ",none:"非公開"};
const STORE_KEY="campus_class_demo_v2";

const SEED_ACCOUNTS=[
  {id:"u_demo",email:"aoki@rikkyo.ac.jp",pass:"demo1234",name:"松岡 蒼己",univ:"立教大学",dept:"法学部法学科",year:"1",verified:true,
    courses:[
      {name:"法政ゲートウェイ講義",status:"current",grade:"未回答",vis:"same"},
      {name:"英語プレゼンテーション",status:"current",grade:"未回答",vis:"same"},
      {name:"民法総則",status:"current",grade:"未回答",vis:"same"}
    ]
  },
  {id:"p1",email:"ren.t@rikkyo.ac.jp",pass:"demo1234",name:"高橋 蓮",univ:"立教大学",dept:"法学部法学科",year:"3",verified:true,
    courses:[
      {name:"民法総則",status:"done",grade:"S",vis:"same"},
      {name:"法政ゲートウェイ講義",status:"done",grade:"A",vis:"same"}
    ]
  },
  {id:"p2",email:"misaki.s@rikkyo.ac.jp",pass:"demo1234",name:"佐藤 美咲",univ:"立教大学",dept:"法学部国際ビジネス法学科",year:"2",verified:true,
    courses:[
      {name:"英語プレゼンテーション",status:"done",grade:"S",vis:"all"},
      {name:"マクロ経済学",status:"done",grade:"A",vis:"same"}
    ]
  },
  {id:"p3",email:"kenta.s@rikkyo.ac.jp",pass:"demo1234",name:"鈴木 健太",univ:"立教大学",dept:"法学部法学科",year:"1",verified:true,
    courses:[
      {name:"法政ゲートウェイ講義",status:"current",grade:"未回答",vis:"same"},
      {name:"情報処理入門",status:"current",grade:"未回答",vis:"same"}
    ]
  }
];

const DEFAULT_STATE={
  currentUid:null,
  accounts:SEED_ACCOUNTS,
  threads:[],
  msgs:{}
};

let state=loadState();
let tab="search", openTid=null, fil="all", authMode="login", authErr="";

function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw)return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}
}
function resetDemo(){
  localStorage.removeItem(STORE_KEY);
  state=JSON.parse(JSON.stringify(DEFAULT_STATE));
  openTid=null;authErr="";
  render();
}
function me(){return state.accounts.find(a=>a.id===state.currentUid)||null}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;openTid=null;render()});

function demoBanner(){
  return `<div class="demo-bar"><span>デモ版（アカウント認証・切替対応）</span><button class="g" id="rst">初期化</button></div>`;
}
function bindCommon(){
  const r=$("#rst");
  if(r)r.onclick=()=>{if(confirm("デモデータを初期状態に戻しますか？"))resetDemo()};
}

function render(){
  const user=me();
  $("#nav").style.display=user?"flex":"none";
  if(!user){rAuth();bindCommon();return}
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  ({search:rSearch,dm:rDM,profile:rProfile})[tab]();
  bindCommon();
}

/* AUTH: ログイン / 新規登録 */
function rAuth(){
  const isReg=authMode==="register";
  $("#app").innerHTML=demoBanner()+`
  <div style="text-align:center;margin:12px 0 18px">
    <h1 style="font-size:22px;margin:0">授業つながり</h1>
    <p class="sub" style="margin:4px 0 0">同じ授業の「タテ・ヨコ」とつながる学生限定アプリ</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="${!isReg?"":"g"}" id="m_login">ログイン</button>
      <button class="${isReg?"":"g"}" id="m_reg">新規登録</button>
    </div>
    ${isReg?`<label>ニックネーム / 表示名</label><input id="a_name" placeholder="例：山田 太郎">
    <label>大学名</label><input id="a_univ" value="立教大学" placeholder="例：立教大学">`:""}
    <label>大学メールアドレス</label>
    <input id="a_email" type="email" placeholder="例：taro@rikkyo.ac.jp">
    <label>パスワード</label>
    <input id="a_pass" type="password" placeholder="4文字以上">
    ${authErr?`<div class="err">${esc(authErr)}</div>`:""}
    <p style="margin:12px 0 0"><button id="a_submit" style="width:100%">${isReg?"大学メールで登録して始める":"ログイン"}</button></p>
  </div>
  <div class="card">
    <h2 style="margin-top:0">デモ用アカウントで試す</h2>
    <p class="sub" style="margin:0 0 8px">入力なしで、登録済み学生としてすぐログインできます（別アカウントに切り替えてDMの見え方も試せます）。</p>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${state.accounts.slice(0,3).map(a=>`<button class="g" data-quick="${esc(a.id)}" style="text-align:left;font-weight:500">${esc(a.name)}（${esc(a.dept||a.univ)} ${esc(a.year||"")}年）<br><span class="sub">${esc(a.email)}</span></button>`).join("")}
    </div>
  </div>`;
  $("#m_login").onclick=()=>{authMode="login";authErr="";render()};
  $("#m_reg").onclick=()=>{authMode="register";authErr="";render()};
  document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>{
    state.currentUid=b.dataset.quick;authErr="";tab="search";saveState();render();
  });
  $("#a_submit").onclick=()=>{
    const email=$("#a_email").value.trim().toLowerCase();
    const pass=$("#a_pass").value;
    if(!email||!email.includes("@")){authErr="メールアドレスを入力してください。";render();return}
    if(pass.length<4){authErr="パスワードは4文字以上で入力してください。";render();return}
    if(isReg){
      const name=$("#a_name").value.trim();
      const univ=$("#a_univ").value.trim();
      if(!name||!univ){authErr="表示名と大学名を入力してください。";render();return}
      if(!/\.ac\.jp$|\.edu$/i.test(email.split("@")[1]||"")){
        authErr="学生限定のため、大学ドメイン（.ac.jp など）のメールで登録してください。";render();return;
      }
      if(state.accounts.some(a=>a.email===email)){authErr="このメールアドレスはすでに登録されています。";render();return}
      const newAcc={id:"u_"+Date.now(),email,pass,name,univ,dept:"",year:"",verified:true,courses:[]};
      state.accounts.push(newAcc);
      state.currentUid=newAcc.id;
      authErr="";tab="profile";saveState();render();
    }else{
      const found=state.accounts.find(a=>a.email===email&&a.pass===pass);
      if(!found){authErr="メールアドレスまたはパスワードが違います。";render();return}
      state.currentUid=found.id;
      authErr="";tab="search";saveState();render();
    }
  };
}

/* 検索・マッチング */
function rSearch(){
  const user=me();
  const mine=user.courses.map(c=>norm(c.name));
  const peers=state.accounts.filter(a=>a.id!==user.id);
  const hits=[];
  peers.forEach(p=>{
    if(user.univ&&norm(p.univ)!==norm(user.univ))return;
    (p.courses||[]).forEach(c=>{if(mine.includes(norm(c.name)))hits.push({p,c})});
  });
  const list=hits.filter(h=>fil==="all"||h.c.status===fil);
  const bycourse={};list.forEach(h=>(bycourse[h.c.name]=bycourse[h.c.name]||[]).push(h));
  const html=Object.keys(bycourse).map(n=>`<h2>${esc(n)}</h2>`+bycourse[n].map(h=>{
    const done=h.c.status==="done",g=h.c.vis==="none"?"非公開":h.c.grade;
    return `<div class="card"><div class="row"><div><b>${esc(h.p.name)}</b><div class="sub">${esc(h.p.dept||"")}${h.p.year?" "+esc(h.p.year)+"年":""}</div>
    <span class="tag ${done?"ok":""}">${done?"履修済み（タテ）":"受講中（ヨコ）"}</span>${done?`<span class="tag">成績 ${esc(g)}</span>`:""}</div>
    <button data-dm="${esc(h.p.id)}" data-c="${esc(h.c.name)}">相談する</button></div></div>`}).join("")).join("");
  $("#app").innerHTML=demoBanner()+`<h1>同じ授業の人</h1><div class="row" style="margin-bottom:10px">
  <select id="f"><option value="all">すべて</option><option value="current">受講中（ヨコ）</option><option value="done">履修済み（タテ）</option></select></div>
  ${user.courses.length?(html||'<p class="sub">同じ授業のユーザーはまだいません。（デモでは「法政ゲートウェイ講義」「英語プレゼンテーション」「民法総則」「マクロ経済学」「情報処理入門」がヒットします）</p>'):'<p class="sub">先に「マイページ」で授業を登録してください。</p>'}`;
  $("#f").value=fil;$("#f").onchange=e=>{fil=e.target.value;render()};
  document.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>startDM(b.dataset.dm,b.dataset.c));
}

function startDM(otherId,course){
  const user=me();
  const ids=[user.id,otherId].sort().join("__");
  const tid="dm_"+ids+"_"+norm(course);
  let t=state.threads.find(x=>x.id===tid);
  if(!t){
    t={id:tid,members:[user.id,otherId],course,last:"",ts:Date.now()};
    state.threads.unshift(t);
    state.msgs[tid]=[];
    saveState();
  }
  tab="dm";openTid=tid;render();
}

/* DM */
function rDM(){
  if(openTid)return rChat();
  const user=me();
  const myThreads=state.threads.filter(t=>t.members.includes(user.id)).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const list=myThreads.map(t=>{
    const oid=t.members.find(id=>id!==user.id);
    const p=state.accounts.find(x=>x.id===oid)||{name:"ユーザー"};
    return `<div class="card" style="cursor:pointer" data-t="${esc(t.id)}"><b>${esc(p.name)}</b> <span class="tag">${esc(t.course||"")}</span><div class="sub">${esc(t.last||"（まだメッセージなし）")}</div></div>`;
  }).join("");
  $("#app").innerHTML=demoBanner()+`<h1>DM</h1>`+(list||'<p class="sub">「さがす」から相談相手を選んでみましょう。</p>');
  document.querySelectorAll(".card[data-t]").forEach(c=>c.onclick=()=>{openTid=c.dataset.t;render()});
}

function autoReplyText(peer,course){
  const cInfo=(peer.courses||[]).find(x=>norm(x.name)===norm(course));
  if(cInfo&&cInfo.status==="done"){
    return `こんにちは！${course}、去年履修してました。テストは持ち込み不可でしたが、配布レジュメの重要語句を中心に押さえれば大丈夫でしたよ！何か気になることありますか？`;
  }
  return `こんにちは！自分も今期${course}取ってます！課題の進め方とか情報交換できると嬉しいです。`;
}

function rChat(){
  const user=me();
  const t=state.threads.find(x=>x.id===openTid);
  const oid=t.members.find(id=>id!==user.id);
  const p=state.accounts.find(x=>x.id===oid)||{name:"ユーザー",courses:[]};
  const list=state.msgs[openTid]||[];
  $("#app").innerHTML=demoBanner()+`<div class="row"><button class="g" id="bk">←</button><h1 style="margin:0">${esc(p.name)}</h1></div>
  <p class="sub">${esc(t.course||"")} ・授業の進め方、課題、テスト対策などを相談できます。過去問そのものの転載は控えてください。</p>
  <div class="msgs" id="ms">${list.map(m=>`<div class="m ${m.from===user.id?"me":""}">${esc(m.text)}</div>`).join("")}</div>
  <div class="row"><textarea id="tx" rows="2" placeholder="メッセージを入力…"></textarea><button id="sd">送信</button></div>`;
  const box=$("#ms");if(box)box.scrollTop=box.scrollHeight;
  $("#bk").onclick=()=>{openTid=null;render()};
  $("#sd").onclick=()=>{
    const v=$("#tx").value.trim();if(!v)return;
    state.msgs[openTid]=state.msgs[openTid]||[];
    state.msgs[openTid].push({from:user.id,text:v,ts:Date.now()});
    t.last=v.slice(0,40);t.ts=Date.now();
    saveState();render();
    if(p.id.startsWith("p")){
      const curTid=openTid;
      setTimeout(()=>{
        const th=state.threads.find(x=>x.id===curTid);
        if(!th)return;
        const reply=autoReplyText(p,t.course);
        state.msgs[curTid].push({from:p.id,text:reply,ts:Date.now()});
        th.last=reply.slice(0,40);th.ts=Date.now();
        saveState();
        if(tab==="dm"&&openTid===curTid)render();
      },700);
    }
  };
}

/* マイページ（アカウント情報 ＋ 履修情報） */
function rProfile(){
  const user=me();
  const cs=user.courses.map((c,i)=>`<div class="card"><div class="row"><b>${esc(c.name)}</b><button class="x" data-del="${i}">削除</button></div>
  <span class="tag ${c.status==="done"?"ok":""}">${c.status==="done"?"履修済み（タテ）":"受講中（ヨコ）"}</span>
  ${c.status==="done"?`<span class="tag">成績 ${esc(c.grade)}</span><span class="tag">${VIS[c.vis]}</span>`:""}</div>`).join("");
  $("#app").innerHTML=demoBanner()+`<h1>マイページ</h1>
  <div class="card">
    <div class="row">
      <div class="avatar">${esc((user.name||"U").slice(0,1))}</div>
      <div>
        <b>${esc(user.name)}</b> <span class="tag ok">学生認証済み</span>
        <div class="sub">${esc(user.email)}</div>
      </div>
      <button class="danger" id="logout">ログアウト</button>
    </div>
  </div>
  <div class="card">
    <label>表示名</label><input id="nm" value="${esc(user.name)}">
    <label>大学名</label><input id="univ" value="${esc(user.univ)}" placeholder="例：立教大学">
    <label>学科</label><input id="dept" value="${esc(user.dept)}" placeholder="例：法学部法学科">
    <label>学年（任意）</label><select id="year"><option value="">未設定</option>${[1,2,3,4,5,6].map(n=>`<option ${user.year==n?"selected":""}>${n}</option>`).join("")}</select>
    <p style="margin:10px 0 0"><button id="sv">プロフィールを保存</button></p>
  </div>
  <h2>履修情報</h2>${cs||'<p class="sub">まだ授業がありません。</p>'}
  <div class="card"><label>授業名</label><input id="cn" placeholder="例：マクロ経済学">
  <div class="row"><div><label>状況</label><select id="cs"><option value="current">受講中</option><option value="done">履修済み</option></select></div>
  <div><label>成績</label><select id="cg">${GRADES.map(g=>`<option>${g}</option>`).join("")}</select></div></div>
  <label>成績の公開範囲</label><select id="cv"><option value="same">同じ授業の人のみ</option><option value="all">全員に公開</option><option value="none">非公開</option></select>
  <p style="margin:10px 0 0"><button id="ac" class="g">授業を追加</button></p></div>`;
  $("#logout").onclick=()=>{state.currentUid=null;openTid=null;saveState();render()};
  $("#sv").onclick=()=>{user.name=$("#nm").value.trim()||user.name;user.univ=$("#univ").value.trim();user.dept=$("#dept").value.trim();user.year=$("#year").value;saveState();$("#sv").textContent="保存しました"};
  $("#ac").onclick=()=>{const n=$("#cn").value.trim();if(!n)return;
    user.courses.push({name:n,status:$("#cs").value,grade:$("#cg").value,vis:$("#cv").value});saveState();render()};
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{user.courses.splice(+b.dataset.del,1);saveState();render()});
}
render();
</script>
</body>
</html>

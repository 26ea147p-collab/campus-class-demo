<script>
/* ページを開いた時点の URL（確認・再設定リンクから戻ってきたかの判定に使う。SDK がハッシュを消す前に控える） */
const INIT_URL = { hash: window.location.hash || "", search: window.location.search || "" };
const initialUrlHas = re => re.test(INIT_URL.hash + INIT_URL.search);
const SUPABASE_URL = "https://hhjnodkkcqzwrtpbmpig.supabase.co";
const SUPABASE_KEY = "sb_publishable_e7DZss988mAQPZ5xqrH2YQ__DPYR8Gz";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").normalize("NFKC").replace(/\s+/g, "").toLowerCase();
const GRADES = ["S","A","B","C","D","未回答"], VIS = {all:"全員に公開", same:"同じ授業の人のみ", none:"非公開"};
/* 頭文字アバターの色（ID から決まる固定色） */
const AV_CLASSES = ["av0","av1","av2","av3","av4","av5"];
const avCls = s => AV_CLASSES[Array.from(String(s || "x")).reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 997, 7) % AV_CLASSES.length];
const initial = s => String(s || "?").trim().slice(0, 1) || "?";

/* ============================================================
   あかさたな順（五十音順）の候補ピッカー
   入力欄をタップ／入力すると、下に候補がよみ順でズラッと開く。
   漢字の音読み・訓読みでズレないよう、候補は必ず「よみ」で並べる。
   ============================================================ */
const toHira = s => String(s ?? "").normalize("NFKC")
  .replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
/* "名前|よみ" の行から候補配列を作る */
const parseAka = txt => txt.trim().split("\n").map(line => {
  const i = line.indexOf("|");
  return i < 0 ? { n: line.trim(), y: "" } : { n: line.slice(0, i).trim(), y: line.slice(i + 1).trim() };
}).filter(x => !!x.n);
const ROW_ORDER = ["あ行","か行","さ行","た行","な行","は行","ま行","や行","ら行","わ行","英数","他"];
function gojuonRow(y) {
  const c = toHira(y).charAt(0);
  if (!c) return "他";
  if (/[あ-おぁ-ぉゔ]/.test(c)) return "あ行";
  if (/[か-ご]/.test(c)) return "か行";
  if (/[さ-ぞ]/.test(c)) return "さ行";
  if (/[た-どっ]/.test(c)) return "た行";
  if (/[な-の]/.test(c)) return "な行";
  if (/[は-ぽ]/.test(c)) return "は行";
  if (/[ま-も]/.test(c)) return "ま行";
  if (/[や-よゃ-ょ]/.test(c)) return "や行";
  if (/[ら-ろ]/.test(c)) return "ら行";
  if (/[わ-んゎゐゑ]/.test(c)) return "わ行";
  if (/[a-z0-9]/.test(c)) return "英数";
  return "他";
}
/* よみの五十音順で並べる（よみが同じなら漢字名で安定化） */
function akaSort(list) {
  return list.map((x, i) => ({ x, i })).sort((a, b) => {
    const ra = ROW_ORDER.indexOf(gojuonRow(a.x.y)), rb = ROW_ORDER.indexOf(gojuonRow(b.x.y));
    if (ra !== rb) return ra - rb;
    const c = toHira(a.x.y).localeCompare(toHira(b.x.y), "ja");
    if (c) return c;
    const d = String(a.x.n).localeCompare(String(b.x.n), "ja");
    return d || a.i - b.i;
  }).map(o => o.x);
}
function akaUniq(list) {
  const seen = new Set(), out = [];
  list.forEach(x => {
    const k = norm(x.n);
    if (!k || !x.n || seen.has(k)) return;
    seen.add(k); out.push(x);
  });
  return out;
}
/* 名前でもよみでも絞り込む（ひらがな・カタカナ・漢字すべて可） */
function akaHit(x, q) {
  const raw = String(q || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "");
  if (!raw) return true;
  const qh = toHira(raw);
  return toHira(norm(x.n)).includes(qh) || toHira(norm(x.y)).includes(qh);
}
function hideAka(listEl) {
  if (listEl) { listEl.classList.remove("on"); listEl.innerHTML = ""; }
}
const AKA_LIMIT = 400;
function drawAkaList(listEl, items, input) {
  let row = "", html = "";
  const curK = norm(input.value);
  items.slice(0, AKA_LIMIT).forEach(it => {
    const r = gojuonRow(it.y);
    if (r !== row) { html += `<div class="sughead">${esc(r)}</div>`; row = r; }
    const on = curK && norm(it.n) === curK;
    html += `<button type="button" class="sugitem${on ? " cur" : ""}" data-pick="${esc(it.n)}">`
      + `<span class="col"><span class="nm">${esc(it.n)}</span>${it.y ? `<span class="yc">${esc(it.y)}</span>` : ""}</span>`
      + `${it.c ? `<span class="cnt">${it.c}人</span>` : ""}</button>`;
  });
  listEl.innerHTML = html || `<div class="sugempty">候補が見つかりません。そのまま入力できます。</div>`;
  listEl.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    input.value = b.dataset.pick;
    hideAka(listEl);
  });
  listEl.classList.add("on");
  const cur = listEl.querySelector(".sugitem.cur");
  listEl.scrollTop = cur ? Math.max(0, cur.offsetTop - listEl.clientHeight / 2) : 0;
}
/* 入力欄と候補リストを結びつける。itemsFn は開くたびに呼ばれる */
function bindAka(input, listEl, itemsFn) {
  if (!input || !listEl) return;
  const draw = () => {
    const all = akaSort(akaUniq(itemsFn() || []));
    const raw = String(input.value || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "");
    const k = norm(input.value);
    const exact = !!k && all.some(x => norm(x.n) === k);
    let items = all;
    if (!exact && raw) {
      /* 入力があるときは前方一致を先に、その中は五十音順 */
      const qh = toHira(raw);
      const hits = all.filter(x => akaHit(x, input.value));
      const pre = hits.filter(x => toHira(norm(x.y)).startsWith(qh) || toHira(norm(x.n)).startsWith(qh));
      items = pre.concat(hits.filter(x => pre.indexOf(x) < 0));
    }
    drawAkaList(listEl, items, input);
  };
  input._akaDraw = draw;
  input.addEventListener("focus", draw);
  input.addEventListener("click", draw);
  input.addEventListener("input", draw);
  input.addEventListener("keydown", e => { if (e.key === "Escape") hideAka(listEl); });
}

let session = null, myProfile = null, myCourses = [];
let tab = "search", openTid = null, openPeer = null, openCourse = "", fil = "all";
let authMode = "login", authErr = "", authOk = "", authEmail = "", recoveryDone = false;
let recoveryInvalid = false, recoveryTimer = null;
let signupConfirmPending = initialUrlHas(/type=signup/), signupTimer = null;
let rtChannel = null;

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.t; openTid = null; render(); });

async function loadMine() {
  const uid = session.user.id;
  const { data: prof } = await sb.from("profiles").select("*").eq("id", uid).single();
  myProfile = prof || { id: uid, display_name: "学生", university: "", department: "", year: "", verified: true };
  const { data: cs } = await sb.from("user_courses").select("*").eq("user_id", uid).order("created_at");
  myCourses = cs || [];
}

async function render() {
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (signupConfirmPending) {
    if (session) {
      /* 確認メールのリンクから戻ってきてセッションが確立できた */
      signupConfirmPending = false; clearTimeout(signupTimer);
      authMode = "signupDone"; authErr = ""; authOk = "";
      clearAuthUrl();
      $("#nav").style.display = "none";
      rSignupDone(); return;
    }
    /* ハッシュのトークン解析中かもしれません。少しだけ待つ */
    $("#nav").style.display = "none";
    $("#app").innerHTML = `<div style="text-align:center;margin:48px 0"><h1 style="font-size:20px;margin:0">メール認証を確認しています…</h1></div>`;
    clearTimeout(signupTimer);
    signupTimer = setTimeout(() => {
      if (!signupConfirmPending) return;
      signupConfirmPending = false;
      authMode = "login"; authErr = SIGNUP_LINK_INVALID_MSG; authOk = "";
      clearAuthUrl(); render();
    }, 2500);
    return;
  }
  if (!session || authMode === "recovery" || authMode === "signupDone") { $("#nav").style.display = "none"; rAuth(); return; }
  $("#nav").style.display = "flex";
  if (!myProfile) await loadMine();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  ({ search: rSearch, dm: rDM, profile: rProfile })[tab]();
}

/* AUTH */
const DUP_MSG = "このメールアドレスはすでに登録されています。ログインするか、パスワードをお忘れの場合はリセットしてください。";
const RESET_SENT_MSG = "パスワード再設定用のメールを送信しました。メール内のリンクを開いて新しいパスワードを設定してください。";
const SIGNUP_DONE_MSG = "✅ メールアドレスの認証が完了しました！";
const SIGNUP_LINK_INVALID_MSG = "この確認リンクは無効か、すでに認証済みです。そのままログインをお試しください。";
const isUnivEmail = email => /\.ac\.jp$|\.edu$/i.test(String(email).split("@")[1] || "");
const isRecoveryUrl = () => initialUrlHas(/type=recovery/);
/* 最後に送ったメールの種類（確認／再設定）。期限切れリンクの案内文を出し分ける */
const MAIL_KIND_KEY = "cc_last_mail_kind";
function setMailKind(k) { try { localStorage.setItem(MAIL_KIND_KEY, k); } catch (e) {} }
function getMailKind() { try { return localStorage.getItem(MAIL_KIND_KEY) || ""; } catch (e) { return ""; } }
function clearAuthUrl() {
  try {
    const u = new URL(window.location.href);
    u.hash = "";
    ["code", "type", "error", "error_description", "error_code"].forEach(k => u.searchParams.delete(k));
    history.replaceState(null, "", u.pathname + (u.search || ""));
  } catch (e) { /* 失敗しても表示は続行 */ }
}

function rAuth() {
  if (authMode === "signupDone") return rSignupDone();
  if (authMode === "forgot") return rForgot();
  if (authMode === "recovery") return rRecovery();
  const isReg = authMode === "register";
  $("#app").innerHTML = `
  <div style="text-align:center;margin:6px 0 20px">
    <div class="brand"><span class="bw">授業</span><span class="bg2">つながり</span></div>
    <p class="sub" style="margin:8px 0 0">同じ授業の「タテ・ヨコ」とつながる学生限定アプリ</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="${!isReg ? "" : "g"}" id="m_login">ログイン</button>
      <button class="${isReg ? "" : "g"}" id="m_reg">新規登録</button>
    </div>
    ${isReg ? `<label>ニックネーム / 表示名</label><input id="a_name" placeholder="例：山田 太郎">
    <label>大学名（タップで候補から選べます）</label><div class="sugwrap"><input id="a_univ" value="立教大学" placeholder="例：立教大学" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="suglist" id="a_univlist"></div></div>` : ""}
    <label>大学メールアドレス</label>
    <input id="a_email" type="email" placeholder="例：taro@rikkyo.ac.jp" value="${esc(authEmail)}">
    <label>パスワード</label>
    <input id="a_pass" type="password" placeholder="6文字以上">
    ${authErr ? `<div class="err">${esc(authErr)}</div>` : ""}
    ${authOk ? `<div class="okmsg">${esc(authOk)}</div>` : ""}
    <p style="margin:12px 0 0"><button id="a_submit" style="width:100%">${isReg ? "大学メールで登録して始める" : "ログイン"}</button></p>
    ${isReg ? "" : `<p style="margin:6px 0 0;text-align:center"><button class="x" id="a_forgot">パスワードを忘れた方はこちら</button></p>`}
  </div>`;
  $("#m_login").onclick = () => { authMode = "login"; authErr = ""; authOk = ""; render(); };
  $("#m_reg").onclick = () => { authMode = "register"; authErr = ""; authOk = ""; render(); };
  if (isReg) bindAka($("#a_univ"), $("#a_univlist"), () => UNIV_LIST);
  if (!isReg) $("#a_forgot").onclick = () => {
    authEmail = ($("#a_email").value || "").trim().toLowerCase();
    authMode = "forgot"; authErr = ""; authOk = ""; render();
  };
  $("#a_submit").onclick = async () => {
    const email = $("#a_email").value.trim().toLowerCase();
    const pass = $("#a_pass").value;
    authErr = ""; authOk = "";
    if (!email || !email.includes("@")) { authErr = "メールアドレスを入力してください。"; render(); return; }
    if (!isUnivEmail(email)) { authErr = "学生限定のため、大学ドメイン（.ac.jp など）のメールで登録してください。"; render(); return; }
    authEmail = email;
    if (isReg) {
      const name = $("#a_name").value.trim();
      const univ = $("#a_univ").value.trim();
      if (!name || !univ) { authErr = "表示名と大学名を入力してください。"; render(); return; }
      if (pass.length < 6) { authErr = "パスワードは6文字以上で入力してください。"; render(); return; }
      const btn = $("#a_submit"); if (btn) { btn.disabled = true; btn.textContent = "登録中…"; }
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: {
        data: { display_name: name, university: univ },
        emailRedirectTo: window.location.origin + window.location.pathname
      } });
      if (error) {
        authErr = /already\s*registered/i.test(error.message || "") ? DUP_MSG : error.message;
        render(); return;
      }
      if (data?.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
        authErr = DUP_MSG; render(); return;
      }
      if (!data.session) {
        /* メール確認待ち：メール内のリンクを開いてからログインしてもらう */
        setMailKind("signup");
        authOk = "確認メールを送りました。メール内のリンクを開いてからログインしてください。";
        authMode = "login"; render(); return;
      }
      myProfile = null; tab = "profile"; render();
    } else {
      const btn = $("#a_submit"); if (btn) { btn.disabled = true; btn.textContent = "ログイン中…"; }

    <p style="margin:12px 0 0"><button id="a_send" style="width:100%">リセットメールを送信</button></p>
    <p style="margin:6px 0 0;text-align:center"><button class="x" id="a_back">ログインに戻る</button></p>

    if (!isUnivEmail(email)) { authErr = "学生限定のため、大学ドメイン（.ac.jp など）のメールを入力してください。"; render(); return; }
    authEmail = email;
    const btn = $("#a_send"); if (btn) { btn.disabled = true; btn.textContent = "送信中…"; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });

/* メール内リンクからの新しいパスワード設定 */
function rRecovery() {
  if (recoveryDone) {
    $("#app").innerHTML = `
    <div style="text-align:center;margin:12px 0 18px">
      <h1 style="font-size:22px;margin:0">パスワード再設定</h1>
    </div>
    <div class="card">
      <div class="okmsg">パスワードを更新しました。</div>
      <p style="margin:12px 0 0"><button id="a_go" style="width:100%">アプリを使いはじめる</button></p>
    </div>`;
    $("#a_go").onclick = () => {
      authMode = "login"; authErr = ""; authOk = ""; recoveryDone = false;
      myProfile = null; tab = "search"; clearAuthUrl(); render();
    };
    return;
  }
  const hasSession = !!session;
  if (!hasSession && !recoveryInvalid) {
    $("#app").innerHTML = `
    <div style="text-align:center;margin:12px 0 18px">
      <h1 style="font-size:22px;margin:0">新しいパスワードを設定</h1>

    </div>`;
    clearTimeout(recoveryTimer);
    recoveryTimer = setTimeout(() => {
      if (authMode === "recovery" && !recoveryDone) { recoveryInvalid = true; render(); }
    }, 2500);
    return;
  }
  $("#app").innerHTML = `
  <div style="text-align:center;margin:12px 0 18px">
    <h1 style="font-size:22px;margin:0">新しいパスワードを設定</h1>
    <p class="sub" style="margin:4px 0 0">${hasSession ? "6文字以上の新しいパスワードを入力してください" : "再設定用のリンクを確認できませんでした"}</p>
  </div>
  <div class="card">
  ${hasSession ? `
    <label>新しいパスワード</label><input id="a_np" type="password" placeholder="6文字以上" autocomplete="new-password">
    <label>新しいパスワード（確認）</label><input id="a_np2" type="password" placeholder="もう一度入力" autocomplete="new-password">
    ${authErr ? `<div class="err">${esc(authErr)}</div>` : ""}
    <p style="margin:12px 0 0"><button id="a_upd" style="width:100%">パスワードを更新</button></p>
  ` : `

    <p style="margin:12px 0 0"><button id="a_retry" style="width:100%">リセットメールを送り直す</button></p>
  `}
  </div>`;
  if (!hasSession) {
    $("#a_retry").onclick = () => {
      authMode = "forgot"; authErr = ""; authOk = ""; recoveryInvalid = false;

    };
    return;

/* 検索・マッチング */
async function rSearch() {

  const mine = myCourses.map(c => norm(c.course_name));

  if (mine.length) {
    const { data } = await sb.from("peer_courses").select("*").neq("user_id", session.user.id);

async function startDM(otherId, course) {
  const uid = session.user.id;
  const [a, b] = [uid, otherId].sort();
  const { data, error } = await sb.from("threads")
    .upsert({ course_name: course, user_a: a, user_b: b }, { onConflict: "course_name,user_a,user_b" })
    .select().single();
  if (error) { alert("スレッドを作成できませんでした: " + error.message); return; }
  tab = "dm"; openTid = data.id; render();
}

/* DM */
async function rDM() {
  if (openTid) return rChat();
  const uid = session.user.id;
  const { data: ths } = await sb.from("threads").select("*")
    .or(`user_a.eq.${uid},user_b.eq.${uid}`).order("last_message_at", { ascending: false, nullsFirst: false });
  const threads = ths || [];
  const ids = [...new Set(threads.flatMap(t => [t.user_a, t.user_b]))].filter(id => id !== uid);
  let names = {};
  if (ids.length) {
    const { data: ps } = await sb.from("profiles").select("id,display_name").in("id", ids);
    (ps || []).forEach(p => names[p.id] = p.display_name);
  }
  const list = threads.map(t => {
    const oid = t.user_a === uid ? t.user_b : t.user_a;
    const nm = names[oid] || "ユーザー";
    return `<div class="card" style="cursor:pointer" data-t="${esc(t.id)}"><div class="row"><div class="avatar ${avCls(oid)}">${esc(initial(nm))}</div><div><b>${esc(nm)}</b> <span class="tag">${esc(t.course_name || "")}</span><div class="sub dmline">${esc(t.last_message || "（まだメッセージなし）")}</div></div><span class="chev">›</span></div></div>`;
  }).join("");
  $("#app").innerHTML = `<div class="brandbar"><span class="bw">授業</span><span class="bg2">つながり</span></div><h1>DM</h1>` + (list || '<p class="sub">「さがす」から相談相手を選んでみましょう。</p>');
  document.querySelectorAll(".card[data-t]").forEach(c => c.onclick = () => { openTid = c.dataset.t; render(); });
}

async function rChat() {
  const uid = session.user.id;
  const { data: t } = await sb.from("threads").select("*").eq("id", openTid).single();
  if (!t) { openTid = null; render(); return; }
  const oid = t.user_a === uid ? t.user_b : t.user_a;
  const { data: p } = await sb.from("profiles").select("*").eq("id", oid).single();
  openPeer = p; openCourse = t.course_name;
  const { data: msgs } = await sb.from("messages").select("*").eq("thread_id", openTid).order("created_at");
  const list = msgs || [];
  $("#app").innerHTML = `<div class="row"><button class="g" id="bk">←</button><h1 class="pf" data-pf="${esc(oid)}" style="margin:0">${esc(p ? p.display_name : "ユーザー")} <span class="sub">›</span></h1></div>
  <p class="sub">${esc(t.course_name || "")} ・授業の進め方、課題、テスト対策などを相談できます。過去問そのものの転載は控えてください。</p>
  <div class="msgs" id="ms">${list.map(m => `<div class="m ${m.sender_id === uid ? "me" : ""}">${esc(m.body)}</div>`).join("")}</div>
  <div class="row"><textarea id="tx" rows="2" placeholder="メッセージを入力…"></textarea><button id="sd">送信</button></div>`;
  const box = $("#ms"); if (box) box.scrollTop = box.scrollHeight;
  const pfh = $("[data-pf]"); if (pfh) pfh.onclick = () => openPeerProfile(oid);
  $("#bk").onclick = () => { openTid = null; if (rtChannel) { sb.removeChannel(rtChannel); rtChannel = null; } render(); };
  $("#sd").onclick = async () => {
    const v = $("#tx").value.trim(); if (!v) return;
    const { error } = await sb.from("messages").insert({ thread_id: openTid, sender_id: uid, body: v });
    if (error) { alert("送信できませんでした: " + error.message); return; }
    render();
  };
  if (rtChannel) sb.removeChannel(rtChannel);
  rtChannel = sb.channel("dm-" + openTid)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "thread_id=eq." + openTid },
      payload => { if (payload.new.sender_id !== uid && openTid) render(); })
    .subscribe();
}

/* 相手のプロフィール（モーダル） */
function closePeerProfile() {
  const sheet = $("#pmodal");
  if (!sheet) return;
  sheet.classList.remove("on");
  const box = $("#pmbody"); if (box) box.innerHTML = "";
  document.body.style.overflow = "";
}

function gradeLabel(c, mine) {
  if (c.status !== "done") return "";
  const vis = c.visibility;
  if (vis === "none") return "成績 非公開";
  if (vis === "same" && !mine.has(norm(c.course_name))) return "成績 同じ授業の人のみ公開";
  return "成績 " + (c.grade || "未回答");
}

function renderPeerProfile(p, cs) {
  const mine = new Set((myCourses || []).map(c => norm(c.course_name)));
  const name = p.display_name || "ユーザー";
  const row = c => {
    const done = c.status === "done", g = gradeLabel(c, mine);
    return `<div class="card" style="margin:0 0 8px;padding:10px 12px">
      <b>${esc(c.course_name)}</b>
      <div style="margin-top:2px"><span class="tag ${done ? "ok" : ""}">${done ? "履修済み（タテ）" : "受講中（ヨコ）"}</span>${g ? `<span class="tag grade">${esc(g)}</span>` : ""}</div>
      <div style="margin-top:6px"><button class="g" data-pfdm="${esc(c.course_name)}" style="font-size:12px;padding:6px 10px">この授業で相談する</button></div>
    </div>`;
  };
  const byName = (a, b) => String(a.course_name).localeCompare(String(b.course_name), "ja");
  const cur = (cs || []).filter(c => c.status !== "done").slice().sort(byName);
  const done = (cs || []).filter(c => c.status === "done").slice().sort(byName);
  return `<div class="row" style="align-items:flex-start">
    <div class="avatar ${avCls(p.id)}">${esc(initial(name))}</div>
    <div style="flex:1;min-width:0"><b style="font-size:16px">${esc(name)}</b>
      <div class="sub">${esc(p.university || "大学未設定")}</div>
      <div class="sub">${esc(p.department || "学科未設定")}${p.year ? " ・ " + esc(p.year) + "年" : ""}</div>
    </div>
    <button class="x" id="pmclose">閉じる</button>
  </div>
  <h2>受講中（ヨコ）</h2>${cur.length ? cur.map(row).join("") : '<p class="sub">受講中の授業は登録されていません。</p>'}
  <h2>履修済み（タテ）</h2>${done.length ? done.map(row).join("") : '<p class="sub">履修済みの授業は登録されていません。</p>'}`;
}

async function openPeerProfile(userId) {
  const sheet = $("#pmodal"), box = $("#pmbody");
  if (!sheet || !box || !userId) return;
  box.innerHTML = `<div class="row"><div style="flex:1"></div><button class="x" id="pmclose">閉じる</button></div><p class="sub">読み込み中…</p>`;
  sheet.classList.add("on");
  document.body.style.overflow = "hidden";
  $("#pmclose").onclick = closePeerProfile;
  const [pr, cr] = await Promise.all([
    sb.from("profiles").select("*").eq("id", userId).single(),
    sb.from("peer_courses").select("*").eq("user_id", userId)
  ]);
  if (!sheet.classList.contains("on")) return; /* 取得中に閉じられた */
  if (pr.error || !pr.data) {
    box.innerHTML = `<div class="row"><div style="flex:1"></div><button class="x" id="pmclose">閉じる</button></div>
      <div class="err">プロフィールを読み込めませんでした。${esc(pr.error ? pr.error.message : "")}</div>`;
    $("#pmclose").onclick = closePeerProfile;
    return;
  }
  box.innerHTML = renderPeerProfile(pr.data, cr.data || []);
  $("#pmclose").onclick = closePeerProfile;
  box.querySelectorAll("[data-pfdm]").forEach(b => b.onclick = () => {
    const course = b.dataset.pfdm;
    closePeerProfile();
    startDM(userId, course);
  });
}

const CHIP_MAX = 6;
/* 名前 → よみ の索引（他ユーザーが登録した名前にもよみを付けたいとき用） */
const YOMI_INDEX = new Map();
[UNIV_LIST, RIKKYO_DEPTS, GENERIC_DEPTS, RIKKYO_COURSES, GENERIC_COURSES].forEach(arr =>
  arr.forEach(x => { const k = norm(x.n); if (k && x.y && !YOMI_INDEX.has(k)) YOMI_INDEX.set(k, x.y); }));
const yomiFor = name => YOMI_INDEX.get(norm(name)) || "";
/* key: 取得済みの大学（正規化済み）。同じ大学なら再取得しない */
let hints = { key: null, univ: "", peers: [], depts: {}, loading: false };
const defaultCourses = univ => (/立教/.test(String(univ || "")) ? RIKKYO_COURSES : GENERIC_COURSES);

/* 同じ大学の他ユーザーが登録した授業（人数つき）と、学部・学科を取得 */
async function loadCourseHints() {
  const univ = String((myProfile && myProfile.university) || "").trim();
  const key = norm(univ);
  if (hints.key === key) return;
  hints = { key, univ, peers: [], depts: {}, loading: !!key };
  renderCourseHintAreas();
  if (!key) return;
  const uid = session && session.user ? session.user.id : "";
  let data = [], error = null;
  try { ({ data, error } = await sb.from("peer_courses").select("course_name,university,user_id,department").limit(2000)); }
  catch (e) { error = e; }
  if (hints.key !== key) return; /* 取得中に大学が変わった */
  if (!error) {
    const m = new Map(), depts = {};
    (data || []).forEach(p => {
      if (!p) return;
      const uk = norm(p.university);
      /* 同じ大学で登録済みの学部・学科（入力中の大学でも使えるよう全大学分を貯める） */
      const d = String(p.department || "").trim();
      if (uk && d) {
        const dm = depts[uk] || (depts[uk] = new Map());
        const dk = norm(d);
        const de = dm.get(dk) || { name: d, users: new Set() };
        de.users.add(p.user_id); dm.set(dk, de);
      }
      if (uk !== key || !p.course_name || p.user_id === uid) return;
      const k = norm(p.course_name);
      let e = m.get(k);
      if (!e) { e = { name: String(p.course_name).trim(), users: new Set() }; m.set(k, e); }
      e.users.add(p.user_id);
    });
    hints.peers = Array.from(m.values())
      .sort((a, b) => b.users.size - a.users.size || a.name.localeCompare(b.name, "ja"))
      .map(e => ({ name: e.name, count: e.users.size }));
    Object.keys(depts).forEach(k => {
      depts[k] = Array.from(depts[k].values()).map(e => ({ name: e.name, count: e.users.size }));
    });
    hints.depts = depts;
  }
  hints.loading = false;
  renderCourseHintAreas();
}

/* 授業名の候補：他ユーザーの登録 → 定番科目。自分が登録済みのものは除く */
function courseCandidates() {
  const registered = new Set((myCourses || []).map(c => norm(c.course_name)));
  const out = [], seen = new Set();
  const put = (name, count) => {
    const k = norm(name);
    if (!k || registered.has(k) || seen.has(k)) return;
    seen.add(k); out.push({ n: String(name).trim(), y: yomiFor(name), c: count || 0 });
  };
  hints.peers.forEach(p => put(p.name, p.count));
  defaultCourses(hints.univ || (myProfile && myProfile.university)).forEach(x => put(x.n, 0));
  return out;
}

/* 学部・学科の候補：立教大学なら立教の学部学科＋一般的な学部学科＋同じ大学の登録済み */
function deptCandidates() {
  const univ = ($("#univ") && $("#univ").value) || (myProfile && myProfile.university) || "";
  const uk = norm(univ);
  const out = [];
  if (/立教/.test(String(univ))) RIKKYO_DEPTS.forEach(x => out.push(x));
  GENERIC_DEPTS.forEach(x => out.push(x));
  ((hints.depts && hints.depts[uk]) || []).forEach(d => out.push({ n: d.name, y: yomiFor(d.name), c: d.count }));
  return out;
}

function pickCourseName(name) {
  const inp = $("#cn"); if (!inp) return;
  inp.value = name;
  hideAka($("#cnlist"));
}

function renderCourseHintAreas() {
  const box = $("#cnchips"), cap = $("#cncap");
  if (!box) return;
  const picked = courseCandidates().slice(0, CHIP_MAX);
  box.innerHTML = picked.map(c => `<button type="button" class="chip" data-pick="${esc(c.n)}">${esc(c.n)}${c.c ? `<span class="cnt">${c.c}人</span>` : ""}</button>`).join("");
  box.style.display = picked.length ? "flex" : "none";
  if (cap) cap.textContent = picked.length ? "タップで入力。候補は同じ大学の登録と定番科目から、あかさたな順（五十音順）で出ます。" : "";
  box.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => pickCourseName(b.dataset.pick));
  const inp = $("#cn"), list = $("#cnlist");
  if (inp && inp._akaDraw && list && list.classList.contains("on")) inp._akaDraw();
  const dinp = $("#dept"), dlist = $("#deptlist");
  if (dinp && dinp._akaDraw && dlist && dlist.classList.contains("on")) dinp._akaDraw();
}

/* 授業名の入力欄を五十音順の候補リストにつなぐ */
function setupCourseHints() {
  const inp = $("#cn"); if (!inp) return;
  bindAka(inp, $("#cnlist"), courseCandidates);
  renderCourseHintAreas();
  loadCourseHints();
}
/* 入力欄の外をタップしたら開いている候補を閉じる */
document.addEventListener("pointerdown", e => {
  const w = e.target && e.target.closest ? e.target.closest(".sugwrap") : null;
  document.querySelectorAll(".suglist.on").forEach(el => { if (!w || !w.contains(el)) hideAka(el); });
}, true);

  $("#app").innerHTML = `<div class="brandbar"><span class="bw">授業</span><span class="bg2">つながり</span></div><h1>マイページ</h1>

    </div>
  </div>
  <div class="card">
    <label>表示名</label><input id="nm" value="${esc(user.display_name)}">
    <label>大学名（タップで候補から選べます）</label><div class="sugwrap"><input id="univ" value="${esc(user.university)}" placeholder="例：立教大学" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="suglist" id="univlist"></div></div>
    <label>学部・学科（タップで候補から選べます）</label><div class="sugwrap"><input id="dept" value="${esc(user.department)}" placeholder="例：法学部 法学科" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="suglist" id="deptlist"></div></div>
    <label>学年（任意）</label><select id="year"><option value="">未設定</option>${[1,2,3,4,5,6].map(n => `<option ${user.year == n ? "selected" : ""}>${n}</option>`).join("")}</select>
    <p style="margin:10px 0 0"><button id="sv">プロフィールを保存</button></p>
  </div>
  <h2>履修情報</h2>${cs || '<p class="sub">まだ授業がありません。</p>'}
  <div class="card"><label>授業名</label>
  <div class="chips" id="cnchips"></div>
  <div class="sugwrap"><input id="cn" placeholder="例：マクロ経済学" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="suglist" id="cnlist"></div></div>
  <div class="sub" id="cncap" style="margin-top:4px"></div>
  <div class="row"><div><label>状況</label><select id="cs"><option value="current">受講中</option><option value="done">履修済み</option></select></div>
  <div><label>成績</label><select id="cg">${GRADES.map(g => `<option>${g}</option>`).join("")}</select></div></div>
  <label>成績の公開範囲</label><select id="cv"><option value="same">同じ授業の人のみ</option><option value="all">全員に公開</option><option value="none">非公開</option></select>
  <p style="margin:10px 0 0"><button id="ac" class="g">授業を追加</button></p></div>`;
  $("#logout").onclick = async () => { await sb.auth.signOut(); myProfile = null; openTid = null; render(); };
  $("#sv").onclick = async () => {
    const upd = { display_name: $("#nm").value.trim() || user.display_name, university: $("#univ").value.trim(), department: $("#dept").value.trim(), year: $("#year").value ? parseInt($("#year").value) : null, updated_at: new Date().toISOString() };
    const { error } = await sb.from("profiles").update(upd).eq("id", session.user.id);
    if (error) { alert("保存できませんでした: " + error.message); return; }
    Object.assign(myProfile, upd); $("#sv").textContent = "保存しました";
    loadCourseHints(); /* 大学名を変えたら候補も取り直す */
  };
  $("#ac").onclick = async () => {
    const n = $("#cn").value.trim(); if (!n) return;
    const { error } = await sb.from("user_courses").insert({ user_id: session.user.id, course_name: n, status: $("#cs").value, grade: $("#cg").value, visibility: $("#cv").value });
    if (error) { alert("追加できませんでした: " + error.message); return; }
    await loadMine(); render();
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    await sb.from("user_courses").delete().eq("id", b.dataset.del);
    await loadMine(); render();
  });
  setupCourseHints();
  bindAka($("#univ"), $("#univlist"), () => UNIV_LIST);
  bindAka($("#dept"), $("#deptlist"), deptCandidates);
}

sb.auth.onAuthStateChange((event) => {
  myProfile = null;
  if (event === "PASSWORD_RECOVERY") {
    authMode = "recovery"; authErr = ""; authOk = ""; recoveryDone = false;
    setTimeout(render, 0); /* コールバック内で直接fetchするとSupabaseのロックで止まることがある */
  } else if (event === "SIGNED_IN" && authErr === SIGNUP_LINK_INVALID_MSG) {
    /* 遅れてセッションが確立した場合：ログイン画面の案内を取り下げてアプリへ */
    authErr = ""; setTimeout(render, 0);
  } else if (signupConfirmPending && (event === "SIGNED_IN" || event === "USER_UPDATED" || event === "INITIAL_SESSION")) {
    /* 確認リンクのセッションが後から確立した場合に備える */
    setTimeout(render, 0);
  }
});
/* 期限切れ・使用済みの確認リンク／再設定リンクで戻ってきた場合 */
function authLinkError() {
  const raw = decodeURIComponent(INIT_URL.hash + "&" + INIT_URL.search);
  if (!/error=/.test(raw)) return "";
  if (!/otp_expired|access_denied|invalid|expired/i.test(raw)) return "";
  if (/type=recovery/.test(raw) || getMailKind() === "recovery")
    return "再設定用のリンクが無効か、有効期限が切れています。「パスワードを忘れた方はこちら」からもう一度送信してください。";
  return SIGNUP_LINK_INVALID_MSG;
}
const linkErr = authLinkError();
if (linkErr) signupConfirmPending = false; /* エラー付きで戻ったときは完了画面を出さない */
if (isRecoveryUrl()) { authMode = "recovery"; authErr = ""; authOk = ""; recoveryInvalid = false; }
else if (linkErr) { authMode = "login"; authErr = linkErr; authOk = ""; clearAuthUrl(); }
/* 相手プロフィールのモーダル：背景タップ・Esc でも閉じる */
{
  const pms = $("#pmodal");
  if (pms) pms.addEventListener("click", e => { if (e.target === pms) closePeerProfile(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePeerProfile(); });
}
render();

   時間割表（受講中）／過去の授業（履修済み）
   ============================================================ */
const slotLabel = slot => slot.charAt(0) + "曜 " + slot.slice(1) + "限";

function renderTTArea() {
  const box = $("#ttpanel");
  if (!box) return;
  renderTTBox(box, ttSeg);
}
/* ホーム画面の「わたしの授業」にも同じ時間割グリッドを描く */
function renderTTAreaHome() {
  const box = $("#ttpanelHome");
  if (!box) return;
  renderTTBox(box, ttSegHome);
}
/* 表示中の時間割（ホーム／マイページのどちらか）を描き直す */
function refreshTT() { renderTTArea(); renderTTAreaHome(); }

function renderTTBox(box, seg) {

  /* 過去の授業（履修済み）は時間割に入れず、リストで管理 */
  if (seg === "done") {
    const done = myCourses.filter(c => c.status === "done")
      .sort((a, b) => String(a.course_name).localeCompare(String(b.course_name), "ja"));
    box.innerHTML = `<div class="listcard">${done.length ? done.map(c => `
      <div class="lrow">
        <div class="txt"><span class="nm">${esc(c.course_name)}</span>
          <span class="sub">履修済み ・ 成績 ${esc(c.grade || "未回答")} ・ ${esc(VIS[c.visibility] || "")}</span></div>
        <button class="x" type="button" data-del="${esc(c.id)}">削除</button>
      </div>`).join("") : `<div class="empty">履修済みの授業はまだありません。</div>`}</div>
      <p class="ttnote">過去の授業は時間割には入りません。受講中の授業は「時間割表」で配置できます。</p>`;
    box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      await sb.from("user_courses").delete().eq("id", b.dataset.del);
      await loadMine(); render();
    });
    return;
  }

  const unplaced = myCourses.filter(c => c.status !== "done" && !slotOf(c.id));
  const today = ttToday();
  let cells = `<div class="ttgrid">`;
  cells += `<div class="tth" aria-hidden="true"></div>`
    + TT_DOW.map((d, i) => `<div class="ttdh${i === 5 ? " sat" : ""}${d === today ? " today" : ""}"><span class="day">${d}</span></div>`).join("");
  TT_PERS.forEach(p => {
    const [tStart, tEnd] = TT_TIME[p].split("〜");
    cells += `<div class="tth"><b>${p}</b><span class="t"><em>${tStart}</em><i></i><em>${tEnd}</em></span></div>`;
    TT_DOW.forEach(d => {
      const slot = d + p, c = courseById(ttMap[slot]);
      if (c) {
        const room = ttRoom(c.id);
        cells += `<button type="button" class="tt-cell on ${ttColor(c.course_name)}" data-slot="${slot}"
          title="${esc(c.course_name)}（${slotLabel(slot)}）"><span class="ttn">${esc(c.course_name)}</span><span class="ttb">${esc(room || "受講中")}</span></button>`;
      } else {
        cells += `<button type="button" class="tt-cell empty" data-slot="${slot}" aria-label="${slotLabel(slot)}に授業を追加"></button>`;
      }
    });
  });
  cells += `</div>`;

  box.innerHTML = `
  <div class="card ttcard">${cells}
    <p class="ttnote">コマをタップして授業を追加・確認できます。この時間割はこの端末にだけ保存され、他の人には表示されません。</p>
  </div>
  ${unplaced.length ? `<div class="card">
    <div class="sub" style="font-weight:700;color:#dde3ff">未配置の受講中授業（${unplaced.length}件）</div>
    <p class="ttnote" style="margin:2px 0 0">空きコマをタップすると、この授業をそこに置けます。</p>
    <div class="chips" style="margin-top:8px">${unplaced.map(c => `<span class="chip" style="opacity:.92">${esc(c.course_name)}</span>`).join("")}</div>
  </div>` : `<p class="ttnote">受講中の授業はすべて時間割に配置されています。</p>`}`;

  box.querySelectorAll(".tt-cell").forEach(b => b.onclick = () => {
    const c = courseById(ttMap[b.dataset.slot]);
    if (c) openSlotDetail(b.dataset.slot, c.id); else openSlotAdd(b.dataset.slot);
  });
}

function flashCell(slot) {
  const el = document.querySelector(`#app .tt-cell[data-slot="${slot}"]`);
  if (!el) return;
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function openTS() {
  const s = $("#tsheet");
  if (!s) return;
  s.classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeTS() {
  const s = $("#tsheet");
  if (!s) return;
  sheetClose(s, $("#tsbody"));
}

/* モーダルを閉じる：フェードアウトが終わってから中身を消す
   （閉じる瞬間に空の箱が縮んで見えないように） */
function sheetClose(sheet, box) {
  if (!sheet) return;
  sheet.classList.remove("on");
  if (box) {
    clearTimeout(box._clearT);
    box._clearT = setTimeout(() => { if (!sheet.classList.contains("on")) box.innerHTML = ""; }, 260);
  }
  document.body.style.overflow = "";
}

/* 空きコマ：授業を追加してこのコマに配置 */
function openSlotAdd(slot) {
  const box = $("#tsbody"); if (!box) return;
  const p = Number(slot.slice(1));
  const unplaced = myCourses.filter(c => c.status !== "done" && !slotOf(c.id));
  const syl = sylInSlot(slot).slice(0, 16);
  box.innerHTML = `
    <div class="row" style="margin-bottom:2px"><b style="flex:1;font-size:17px">${slotLabel(slot)}</b><button class="x" type="button" id="tsclose">閉じる</button></div>
    <p class="sub" style="margin:0 0 10px">${TT_TIME[p]} ・ ここに授業を入れます</p>
    ${unplaced.length ? `<div class="sub" style="font-weight:700;color:#dde3ff">未配置の受講中授業から置く</div>
      <div class="chips">${unplaced.map(c => `<button type="button" class="chip" data-put="${esc(c.id)}">＋ ${esc(c.course_name)}</button>`).join("")}</div>` : ""}
    ${syl.length ? `<div class="sub" style="font-weight:700;color:#dde3ff;margin-top:6px">主なシラバス科目</div>
      <div class="chips">${syl.map(c => `<button type="button" class="chip" data-new="${esc(c.n)}">${esc(c.n)}</button>`).join("")}</div>` : ""}
    <label>授業名（この時限の開講科目・あかさたな順の候補から選べます）</label>
    <div class="sugwrap"><input id="tscn" placeholder="例：法学入門" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="suglist" id="tscnlist"></div></div>
    <div class="sub" id="tssyl" style="margin-top:6px;min-height:16px"></div>
    <p style="margin:8px 0 0"><button type="button" id="tsadd" style="width:100%">この授業を追加して配置</button></p>
    <p class="ttnote" style="text-align:center">時間割はこの端末にだけ保存されます</p>`;
  openTS();
  $("#tsclose").onclick = closeTS;

  const inp = $("#tscn");
  /* 空欄のときは、この時限の開講科目を先頭のまとまりとして出す（入力すると全科目から検索） */
  bindAka(inp, $("#tscnlist"), () => {
    const base = courseCandidates();
    const grp = `この時限（${slotLabel(slot)}）の開講科目`;
    const here = base.filter(x => sylSlots(x.n).indexOf(slot) >= 0).sort(sylChipSort);
    return here.map(x => ({ n: x.n, y: x.y, c: x.c, sub: x.sub, grp, onlyEmpty: true })).concat(base);
  }, { filterAlways: true });
  const hint = () => {
    const v = inp.value.trim();
    if (!v) { $("#tssyl").textContent = ""; return; }
    const ss = sylSlots(v), lb = sylLabel(v);
    $("#tssyl").textContent = !ss.length ? ""
      : (ss.indexOf(slot) >= 0
        ? `シラバスでもこの時限（${lb}）に開講されています。`
        : `シラバス上の開講：${lb}（空きコマに入れると重複する場合があります）`);
  };
  inp.addEventListener("input", hint);

  box.querySelectorAll("[data-put]").forEach(b => b.onclick = () => {
    ttSet(slot, b.dataset.put);
    closeTS(); refreshTT(); flashCell(slot);
  });
  box.querySelectorAll("[data-new]").forEach(b => b.onclick = () => {
    inp.value = b.dataset.new; hideAka($("#tscnlist")); hint();
  });
  $("#tsadd").onclick = async () => {
    const name = inp.value.trim();
    if (!name) { try { inp.focus(); } catch (e) {} return; }
    const btn = $("#tsadd");
    btn.disabled = true; btn.textContent = "追加中…";
    let row = myCourses.find(c => c.status !== "done" && norm(c.course_name) === norm(name));
    if (!row) {
      const { data, error } = await sb.from("user_courses")
        .insert({ user_id: session.user.id, course_name: name, status: "current", grade: "未回答", visibility: "same" })
        .select().single();
      if (error) { alert("追加できませんでした: " + error.message); btn.disabled = false; btn.textContent = "この授業を追加して配置"; return; }
      await loadMine();
      row = courseById(data.id) || myCourses.find(c => norm(c.course_name) === norm(name));
    }
    if (!row) { btn.disabled = false; btn.textContent = "この授業を追加して配置"; return; }
    ttSet(slot, row.id);
    closeTS(); refreshTT(); flashCell(slot);
  };
}

/* 埋まっているコマ：授業の詳細（同じ授業の人／DM／移動／外す／削除） */
function openSlotDetail(slot, id) {
  const box = $("#tsbody"); if (!box) return;
  const c = courseById(id);
  if (!c) { delete ttMap[slot]; ttSave(); refreshTT(); return; }
  const s = sylSlot(c.course_name), p = Number(slot.slice(1));
  const room = ttRoom(c.id);
  box.innerHTML = `
    <div class="row" style="margin-bottom:6px"><b style="flex:1;font-size:16px;line-height:1.45">${esc(c.course_name)}</b><button class="x" type="button" id="tsclose">閉じる</button></div>
    <div><span class="tag">${slotLabel(slot)}</span><span class="tag">受講中</span>${s && s !== slot ? `<span class="tag vis">シラバス：${s}</span>` : ""}</div>
    <p class="sub" style="margin:4px 0 10px">${TT_TIME[p]}</p>
    <label for="ttroom">教室・メモ（任意）</label>
    <div class="row" style="gap:8px;margin-bottom:12px">
      <input id="ttroom" maxlength="12" placeholder="例：4253" value="${esc(room)}" autocomplete="off" style="flex:1;min-width:0">
      <button type="button" class="g" id="ttroomsave" style="flex:none;padding:0 14px">保存</button>
    </div>
    <p style="margin:0 0 8px"><button type="button" id="ttpeer" style="width:100%">同じ授業の人を見る</button></p>
    <p style="margin:0 0 8px"><button type="button" class="g" id="ttdm" style="width:100%">DMへ</button></p>
    <p style="margin:0 0 8px"><button type="button" class="g" id="ttmove" style="width:100%">コマを移動する</button></p>
    <p style="margin:0 0 8px"><button type="button" class="g" id="ttunplace" style="width:100%">時間割から外す（授業は残す）</button></p>
    <p style="margin:0"><button type="button" class="danger" id="ttdel" style="width:100%">この授業を削除</button></p>
    <p class="ttnote" style="text-align:center">時間割はこの端末にだけ保存されています</p>`;
  openTS();
  $("#tsclose").onclick = closeTS;
  $("#ttpeer").onclick = () => { closeTS(); cfil = c.course_name; q = ""; tab = "search"; saveUIState(); render(); };
  $("#ttdm").onclick = () => { closeTS(); tab = "dm"; saveUIState(); render(); };
  $("#ttmove").onclick = () => openSlotPicker(c);
  $("#ttroomsave").onclick = () => {
    ttSetRoom(c.id, $("#ttroom").value);
    const v = ttRoom(c.id);
    /* ホーム／マイページどちらの時間割でも、同じコマのバッジをその場で更新する */
    document.querySelectorAll(`.tt-cell[data-slot="${slot}"] .ttb`).forEach(el => { el.textContent = v || "受講中"; });
    const b = $("#ttroomsave");
    if (b) { b.textContent = "保存しました"; setTimeout(() => { if (b) b.textContent = "保存"; }, 1400); }
  };
  $("#ttunplace").onclick = () => { ttClear(c.id); closeTS(); refreshTT(); };
  let armed = false;
  $("#ttdel").onclick = async () => {
    const b = $("#ttdel");
    if (!armed) { armed = true; b.textContent = "もう一度タップで削除（元に戻せません）"; return; }
    b.disabled = true; b.textContent = "削除中…";
    const { error } = await sb.from("user_courses").delete().eq("id", c.id);
    if (error) { alert("削除できませんでした: " + error.message); b.disabled = false; armed = false; b.textContent = "この授業を削除"; return; }
    ttClear(c.id);
    await loadMine();
    closeTS(); render();
  };
}

/* コマの移動先を選ぶ */
function openSlotPicker(c) {
  const box = $("#tsbody"); if (!box) return;
  let html = `<div class="row" style="margin-bottom:4px"><b style="flex:1;font-size:16px">${esc(c.course_name)}</b><button class="x" type="button" id="tsclose">閉じる</button></div>
    <p class="sub" style="margin:0 0 6px">移動先のコマを選んでください（今は ${slotLabel(slotOf(c.id))}）</p><div class="ttpick">`;
  TT_PERS.forEach(p => TT_DOW.forEach(d => {
    const slot = d + p, other = ttMap[slot] && ttMap[slot] !== c.id ? courseById(ttMap[slot]) : null;
    html += `<button type="button" data-mv="${slot}"${other ? ` style="opacity:.6" title="${esc(other.course_name)}"` : ""}>${d}${p}</button>`;
  }));
  html += `</div><p class="ttnote">空いているコマには「＋」からも置けます。埋まっているコマに移すと、その授業は未配置に戻ります。</p>`;
  box.innerHTML = html;
  $("#tsclose").onclick = closeTS;
  box.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
    const slot = b.dataset.mv;
    ttSet(slot, c.id);
    closeTS(); refreshTT(); flashCell(slot);
  });
}

/* ============================================================
   認証
   ============================================================ */
const DUP_MSG = "このメールアドレスはすでに登録されています。ログインするか、パスワードをお忘れの場合はリセットしてください。";
const RESET_SENT_MSG = "パスワード再設定用のメールを送信しました。メール内のリンクを開いて新しいパスワードを設定してください。";
const SIGNUP_DONE_MSG = "✅ メールアドレスの認証が完了しました！";
const SIGNUP_LINK_INVALID_MSG = "この確認リンクは無効か、すでに認証済みです。そのままログインをお試しください。";
const isUnivEmail = email => /\.ac\.jp$|\.edu$/i.test(String(email).split("@")[1] || "");
const isRecoveryUrl = () => initialUrlHas(/type=recovery/);
const MAIL_KIND_KEY = "cc_last_mail_kind";
function setMailKind(k) { try { localStorage.setItem(MAIL_KIND_KEY, k); } catch (e) {} }
function getMailKind() { try { return localStorage.getItem(MAIL_KIND_KEY) || ""; } catch (e) { return ""; } }
function clearAuthUrl() {
  try {
    const u = new URL(window.location.href);
    u.hash = "";
    ["code", "type", "error", "error_description", "error_code"].forEach(k => u.searchParams.delete(k));
    history.replaceState(null, "", u.pathname + (u.search || ""));
  } catch (e) { /* 失敗しても表示は続行 */ }
}

function rAuth() {
  if (authMode === "signupDone") return rSignupDone();
  if (authMode === "forgot") return rForgot();
  if (authMode === "recovery") return rRecovery();
  const isReg = authMode === "register";
  $("#app").innerHTML = `
  <div class="tophead" style="margin-bottom:14px">
    <div class="logo"><span class="mark"></span><span class="bw">授業</span><span class="bg2">つながり</span></div>
  </div>
  <h1 style="font-size:24px;margin:0 0 8px;line-height:1.4">同じ授業の人に、<br>気軽に相談しよう。</h1>
  <p class="sub" style="margin:0 0 16px">大学のメールアドレスで学生認証をしてはじめます。立教大学をはじめ、大学ドメイン（.ac.jp / .edu）のアドレスだけ登録できます。</p>
  <div class="card auth">
    <div class="tabs">
      <button type="button" class="${!isReg ? "" : "g"}" id="m_login">ログイン</button>
      <button type="button" class="${isReg ? "" : "g"}" id="m_reg">新規登録</button>
    </div>
    <form id="a_form" autocomplete="on" novalidate>
    ${isReg ? `<label>ニックネーム / 表示名</label><input id="a_name" name="nickname" placeholder="例：山田 太郎" autocomplete="nickname" autocapitalize="words" spellcheck="false">
    <label>大学名（タップで候補から選べます）</label><div class="sugwrap"><input id="a_univ" name="organization" value="立教大学" placeholder="例：立教大学" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="suglist" id="a_univlist"></div></div>` : ""}
    <label>大学メールアドレス</label>
    <input id="a_email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="例：taro@rikkyo.ac.jp" value="${esc(authEmail)}">
    <label>パスワード</label>
    <input id="a_pass" name="password" type="password" autocomplete="${isReg ? "new-password" : "current-password"}" autocapitalize="none" spellcheck="false" placeholder="6文字以上">
    ${authErr ? `<div class="err">${esc(authErr)}</div>` : ""}
    ${authOk ? `<div class="okmsg">${esc(authOk)}</div>` : ""}
    <p style="margin:12px 0 0"><button id="a_submit" type="submit" style="width:100%">${isReg ? "大学メールで登録して始める" : "ログイン"}</button></p>
    ${isReg ? "" : `<p style="margin:6px 0 0;text-align:center"><button type="button" class="x" id="a_forgot">パスワードを忘れた方はこちら</button></p>`}
    </form>
  </div>`;
  $("#m_login").onclick = () => { authMode = "login"; authErr = ""; authOk = ""; render(); };
  $("#m_reg").onclick = () => { authMode = "register"; authErr = ""; authOk = ""; render(); };
  if (isReg) bindAka($("#a_univ"), $("#a_univlist"), () => UNIV_LIST);
  if (!isReg) $("#a_forgot").onclick = () => {
    authEmail = ($("#a_email").value || "").trim().toLowerCase();
    authMode = "forgot"; authErr = ""; authOk = ""; render();
  };
  $("#a_form").onsubmit = async (e) => {
    if (e) e.preventDefault();   /* 画面遷移はせず、この場でログイン／登録する */
    const email = $("#a_email").value.trim().toLowerCase();
    const pass = $("#a_pass").value;
    authErr = ""; authOk = "";
    if (!email || !email.includes("@")) { authErr = "メールアドレスを入力してください。"; render(); return; }
    if (!isUnivEmail(email)) { authErr = "学生限定のため、大学ドメイン（.ac.jp など）のメールで登録してください。"; render(); return; }
    authEmail = email;
    if (isReg) {
      const name = $("#a_name").value.trim();
      const univ = $("#a_univ").value.trim();
      if (!name || !univ) { authErr = "表示名と大学名を入力してください。"; render(); return; }
      if (pass.length < 6) { authErr = "パスワードは6文字以上で入力してください。"; render(); return; }
      const btn = $("#a_submit"); if (btn) { btn.disabled = true; btn.textContent = "登録中…"; }
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: {
        data: { display_name: name, university: univ },
        emailRedirectTo: window.location.origin + window.location.pathname
      } });
      if (error) {
        authErr = /already\s*registered/i.test(error.message || "") ? DUP_MSG : error.message;
        render(); return;
      }
      if (data?.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
        authErr = DUP_MSG; render(); return;
      }
      setLastEmail(email);   /* 次回ログイン画面で最初から入っているように */
      if (!data.session) {
        /* メール確認待ち：メール内のリンクを開いてからログインしてもらう */
        setMailKind("signup");
        authOk = "確認メールを送りました。メール内のリンクを開いてからログインしてください。";
        authMode = "login"; render(); return;
      }
      myProfile = null; tab = "profile"; saveUIState(); render();
    } else {
      const btn = $("#a_submit"); if (btn) { btn.disabled = true; btn.textContent = "ログイン中…"; }
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) { authErr = "メールアドレスまたはパスワードが違います。"; render(); return; }
      setLastEmail(email);   /* 次回ログイン画面で最初から入っているように */
      myProfile = null;
      /* 初回ログインはホームから。保存された画面があればそれを復元する */
      tab = "home"; openTid = null; saveUIState(); render();
    }
  };
  paintView();
}

/* 確認メールのリンクから戻ってきたときの完了画面 */
function rSignupDone() {
  const email = session?.user?.email || authEmail || "";
  $("#app").innerHTML = `
  <div style="text-align:center;margin:12px 0 18px">
    <h1 style="font-size:22px;margin:0">メール認証が完了しました</h1>
    <p class="sub" style="margin:4px 0 0">${esc(email)}</p>
  </div>
  <div class="card">
    <div class="okmsg" style="font-size:16px;font-weight:700;text-align:center">${esc(SIGNUP_DONE_MSG)}</div>
    <p class="sub" style="margin:10px 0 0;text-align:center">つぎはプロフィールを設定して、同じ授業の人とつながりましょう。</p>
    <p style="margin:16px 0 0"><button id="a_start" style="width:100%">プロフィールを設定して始める</button></p>
  </div>`;
  $("#a_start").onclick = () => {
    authMode = "login"; authErr = ""; authOk = ""; myProfile = null; tab = "profile"; saveUIState(); render();
  };
  paintView();
}

/* パスワード再設定メールの送信 */
function rForgot() {
  $("#app").innerHTML = `
  <div style="margin:8px 0 18px">
    <h1 style="font-size:22px;margin:0 0 4px">パスワード再設定</h1>
    <p class="sub" style="margin:0">登録した大学メールアドレスに再設定用のリンクを送ります</p>
  </div>
  <div class="card">
    <label>大学メールアドレス</label>
    <input id="a_email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="例：taro@rikkyo.ac.jp" value="${esc(authEmail)}">
    ${authErr ? `<div class="err">${esc(authErr)}</div>` : ""}
    ${authOk ? `<div class="okmsg">${esc(authOk)}</div>` : ""}
    <p style="margin:12px 0 0"><button id="a_send" style="width:100%">リセットメールを送信</button></p>
    <p style="margin:6px 0 0;text-align:center"><button class="x" id="a_back">ログインに戻る</button></p>
  </div>`;
  $("#a_back").onclick = () => { authMode = "login"; authErr = ""; authOk = ""; render(); };
  $("#a_send").onclick = async () => {
    const email = $("#a_email").value.trim().toLowerCase();
    authErr = ""; authOk = "";
    if (!email || !email.includes("@")) { authErr = "メールアドレスを入力してください。"; render(); return; }
    if (!isUnivEmail(email)) { authErr = "学生限定のため、大学ドメイン（.ac.jp など）のメールを入力してください。"; render(); return; }
    authEmail = email;
    const btn = $("#a_send"); if (btn) { btn.disabled = true; btn.textContent = "送信中…"; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    if (error) {
      authErr = /security purposes|rate.?limit/i.test(error.message || "")
        ? "送信回数が上限に達しました。しばらく待ってからもう一度お試しください。"
        : "送信できませんでした: " + error.message;
      render(); return;
    }
    setMailKind("recovery");
    authOk = RESET_SENT_MSG; render();
  };
  paintView();
}

/* メール内リンクからの新しいパスワード設定 */
function rRecovery() {
  if (recoveryDone) {
    $("#app").innerHTML = `
    <div style="text-align:center;margin:12px 0 18px">
      <h1 style="font-size:22px;margin:0">パスワード再設定</h1>
    </div>
    <div class="card">
      <div class="okmsg">パスワードを更新しました。</div>
      <p style="margin:12px 0 0"><button id="a_go" style="width:100%">アプリを使いはじめる</button></p>
    </div>`;
    $("#a_go").onclick = () => {
      authMode = "login"; authErr = ""; authOk = ""; recoveryDone = false;
      myProfile = null; tab = "home"; clearAuthUrl(); saveUIState(); render();
    };
    paintView();
    return;
  }
  const hasSession = !!session;
  if (!hasSession && !recoveryInvalid) {
    $("#app").innerHTML = `
    <div style="text-align:center;margin:12px 0 18px">
      <h1 style="font-size:22px;margin:0">新しいパスワードを設定</h1>
      <p class="sub" style="margin:4px 0 0">再設定用のリンクを確認しています…</p>
    </div>`;
    clearTimeout(recoveryTimer);
    recoveryTimer = setTimeout(() => {
      if (authMode === "recovery" && !recoveryDone) { recoveryInvalid = true; render(); }
    }, 2500);
    return;
  }
  $("#app").innerHTML = `
  <div style="margin:8px 0 18px">
    <h1 style="font-size:22px;margin:0 0 4px">新しいパスワードを設定</h1>
    <p class="sub" style="margin:0">${hasSession ? "6文字以上の新しいパスワードを入力してください" : "再設定用のリンクを確認できませんでした"}</p>
  </div>
  <div class="card">
  ${hasSession ? `
    <label>新しいパスワード</label><input id="a_np" type="password" placeholder="6文字以上" autocomplete="new-password">
    <label>新しいパスワード（確認）</label><input id="a_np2" type="password" placeholder="もう一度入力" autocomplete="new-password">
    ${authErr ? `<div class="err">${esc(authErr)}</div>` : ""}
    <p style="margin:12px 0 0"><button id="a_upd" style="width:100%">パスワードを更新</button></p>
  ` : `
    <div class="err">リンクが無効か、有効期限が切れています。もう一度リセットメールを送信してください。</div>
    <p style="margin:12px 0 0"><button id="a_retry" style="width:100%">リセットメールを送り直す</button></p>
  `}
  </div>`;
  if (!hasSession) {
    $("#a_retry").onclick = () => {
      authMode = "forgot"; authErr = ""; authOk = ""; recoveryInvalid = false;
      clearAuthUrl(); render();
    };
    return;
  }
  $("#a_upd").onclick = async () => {
    const p1 = $("#a_np").value, p2 = $("#a_np2").value;
    authErr = "";
    if (p1.length < 6) { authErr = "パスワードは6文字以上で入力してください。"; render(); return; }
    if (p1 !== p2) { authErr = "確認用のパスワードが一致しません。"; render(); return; }
    const btn = $("#a_upd"); if (btn) { btn.disabled = true; btn.textContent = "更新中…"; }
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) { authErr = "更新できませんでした: " + error.message; render(); return; }
    recoveryDone = true; authErr = ""; myProfile = null; tab = "home"; clearAuthUrl(); saveUIState(); render();
  };
  paintView();
}

sb.auth.onAuthStateChange((event) => {
  myProfile = null;
  if (event === "PASSWORD_RECOVERY") {
    authMode = "recovery"; authErr = ""; authOk = ""; recoveryDone = false;
    setTimeout(render, 0); /* コールバック内で直接fetchするとSupabaseのロックで止まることがある */
  } else if (event === "SIGNED_IN" && authErr === SIGNUP_LINK_INVALID_MSG) {
    authErr = ""; setTimeout(render, 0);
  } else if (signupConfirmPending && (event === "SIGNED_IN" || event === "USER_UPDATED" || event === "INITIAL_SESSION")) {
    setTimeout(render, 0);
  }
});
/* 期限切れ・使用済みの確認リンク／再設定リンクで戻ってきた場合 */
function authLinkError() {
  const raw = decodeURIComponent(INIT_URL.hash + "&" + INIT_URL.search);
  if (!/error=/.test(raw)) return "";
  if (!/otp_expired|access_denied|invalid|expired/i.test(raw)) return "";
  if (/type=recovery/.test(raw) || getMailKind() === "recovery")
    return "再設定用のリンクが無効か、有効期限が切れています。「パスワードを忘れた方はこちら」からもう一度送信してください。";
  return SIGNUP_LINK_INVALID_MSG;
}
const linkErr = authLinkError();
if (linkErr) signupConfirmPending = false;
if (isRecoveryUrl()) { authMode = "recovery"; authErr = ""; authOk = ""; recoveryInvalid = false; }
else if (linkErr) { authMode = "login"; authErr = linkErr; authOk = ""; clearAuthUrl(); }

/* モーダル：背景タップ・Esc でも閉じる */
{
  const pms = $("#pmodal");
  if (pms) pms.addEventListener("click", e => { if (e.target === pms) closePeerProfile(); });
  const nms = $("#nsheet");
  if (nms) nms.addEventListener("click", e => { if (e.target === nms) closeNotif(); });
  const asms = $("#asheet");
  if (asms) asms.addEventListener("click", e => { if (e.target === asms) closeAvatarPicker(); });
  const tms = $("#tsheet");
  if (tms) tms.addEventListener("click", e => { if (e.target === tms) closeTS(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closePeerProfile(); closeNotif(); closeAvatarPicker(); closeTS(); } });
}

/* 保存された画面（タブ・開いていたDM・絞り込み）を復元して起動
   （パスワード再設定・メール認証のURLで開いたときは、そちらの画面を優先） */
if (!isRecoveryUrl() && !initialUrlHas(/type=signup/) && !linkErr) loadUIState();
if (openTid && tab !== "dm") openTid = null;
render();
</script>
</body>

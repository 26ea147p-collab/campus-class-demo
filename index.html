<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>授業つながり</title>
<style>
:root{
  --bg:#070a19;
  --card:rgba(17,23,48,0.82);
  --card2:rgba(10,14,32,0.85);
  --tx:#eef1fb;
  --sub:#98a1c6;
  --ac:#17d4ff;
  --ac2:rgba(23,212,255,0.13);
  --bd:rgba(255,255,255,0.10);
  --pink:#ec38bc;
  --ok:#3ee6a8;
  --err:#ff7a94;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html{background:#070a19;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;color:var(--tx);
  font:15px/1.55 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  background:
    radial-gradient(760px 560px at 4% -8%, rgba(168,45,220,0.34), transparent 62%),
    radial-gradient(820px 600px at 102% 4%, rgba(64,110,255,0.16), transparent 62%),
    radial-gradient(940px 780px at 100% 104%, rgba(18,170,230,0.30), transparent 64%),
    radial-gradient(620px 480px at 44% 52%, rgba(92,42,175,0.16), transparent 70%),
    linear-gradient(165deg,#070a19 0%,#0a0f22 52%,#0d1229 100%);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px);
  background-size:24px 24px;
}
main{
  position:relative;z-index:1;width:100%;max-width:480px;min-height:calc(100vh - 20px);
  margin:10px auto;padding:18px 16px 118px;
  background:linear-gradient(180deg, rgba(13,18,42,0.80), rgba(9,13,30,0.90));
  border:1px solid rgba(255,255,255,0.10);border-radius:26px;
  box-shadow:0 26px 70px rgba(0,0,0,0.55),0 0 46px rgba(23,212,255,0.05),inset 0 1px 0 rgba(255,255,255,0.07);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
@media (max-width:520px){
  main{margin:0;min-height:100vh;border-radius:0;border-left:0;border-right:0;padding-top:16px}
}
h1{font-size:19px;line-height:1.35;margin:2px 0 12px;font-weight:800;letter-spacing:0.01em;color:#f2f5ff}
h2{font-size:14px;margin:20px 0 10px;font-weight:700;color:#dde3ff;display:flex;align-items:center;gap:8px}
h2::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,#17d4ff,#ec38bc);box-shadow:0 0 12px rgba(23,212,255,0.8)}
h2.pinkdot::before{background:linear-gradient(135deg,#ec38bc,#ff8ce3);box-shadow:0 0 12px rgba(236,56,188,0.8)}
.bw{color:#fff}
.bg2{background:linear-gradient(90deg,#ff4df0,#23d5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{font-size:26px;font-weight:800;letter-spacing:0.03em;line-height:1.2}
.brandbar{font-size:13px;font-weight:700;letter-spacing:0.06em;margin:0 0 14px;opacity:0.95}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;

label{display:block;font-size:12px;color:var(--sub);margin:10px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:12px;

input::placeholder,textarea::placeholder{color:rgba(152,161,198,0.66)}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(23,212,255,0.55);box-shadow:0 0 0 3px rgba(23,212,255,0.14)}
select{appearance:none;-webkit-appearance:none;padding-right:34px;

option{background:#101630;color:var(--tx)}
button{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(90deg,#ec38bc,#17d4ff);

button:active{filter:brightness(1.1)}
button:disabled{opacity:0.6}
button.g{background:rgba(255,255,255,0.08);color:#e9edff;border:1px solid rgba(255,255,255,0.14);box-shadow:none}
button.x{background:transparent;color:var(--sub);padding:6px 10px;font-weight:600;box-shadow:none}
button.danger{background:rgba(255,90,120,0.10);color:#ff8fa6;border:1px solid rgba(255,90,120,0.28);box-shadow:none}

.row{display:flex;gap:8px;align-items:center}

.row>button{flex:none}
.row>.avatar{flex:none}

.tag.grade{background:rgba(62,230,168,0.13);color:#5ff0bb;border-color:rgba(62,230,168,0.32)}

.err{color:var(--err);font-size:12px;margin-top:8px}
.okmsg{color:var(--ok);font-size:12px;margin-top:8px}

.msgs{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;margin:10px 0;padding:4px 2px}
.m{max-width:80%;padding:9px 13px;border-radius:16px;background:rgba(255,255,255,0.07);

.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,#23d5ff,#0a6cff);color:#fff;

.av0{background:linear-gradient(140deg,#23d5ff,#0a6cff)}
.av1{background:linear-gradient(140deg,#ff4df0,#8a2bff)}
.av2{background:linear-gradient(140deg,#ff9a3c,#ff4d6d)}
.av3{background:linear-gradient(140deg,#3ee6a8,#0e9c78)}
.av4{background:linear-gradient(140deg,#a06bff,#4a2bff)}
.av5{background:linear-gradient(140deg,#17d4ff,#ec38bc)}
.avatar>svg{width:100%;height:100%;display:block;border-radius:50%}
.avatar>img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.avatar.mk{background:transparent;border-color:transparent;box-shadow:none;text-shadow:none;overflow:hidden}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 14px}
.avpick{position:relative;aspect-ratio:1/1;padding:0;border:2px solid transparent;border-radius:50%;
  background:rgba(255,255,255,0.05);box-shadow:none;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
.avpick>svg{width:100%;height:100%;display:block}
.avpick:active{opacity:0.8}
.avpick.on{border-color:#17d4ff;background:rgba(23,212,255,0.10);
  box-shadow:0 0 0 3px rgba(23,212,255,0.20),0 10px 24px rgba(23,212,255,0.32)}
.avpick .tick{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;
  background:linear-gradient(90deg,#ec38bc,#17d4ff);color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;border:2px solid #0d1230}
.avnow{flex:none}
.avnowtxt{min-width:0;flex:1}
.chev{flex:none;color:var(--sub);font-size:18px;line-height:1}
.dmline{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugwrap{position:relative}
.suglist{position:absolute;z-index:45;left:0;right:0;top:calc(100% + 6px);background:rgba(15,20,42,0.98);
  border:1px solid rgba(255,255,255,0.14);border-radius:14px;
  box-shadow:0 18px 40px rgba(0,0,0,0.6),0 0 0 1px rgba(23,212,255,0.10);

  max-height:min(58vh,420px);overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;display:none}
.suglist.on{display:block}
.sughead{position:sticky;top:0;z-index:1;padding:6px 13px;font-size:11px;font-weight:800;letter-spacing:0.08em;

.sugitem{display:flex;width:100%;gap:8px;align-items:center;justify-content:space-between;background:transparent;
  color:var(--tx);font-weight:500;text-align:left;border-radius:0;padding:9px 13px;
  border-bottom:1px solid rgba(255,255,255,0.06);box-shadow:none}
.sugitem:last-child{border-bottom:0}
.sugitem:active,.sugitem:hover{background:rgba(23,212,255,0.12)}
.sugitem.cur{background:rgba(23,212,255,0.10);box-shadow:inset 3px 0 0 #17d4ff}
.sugitem .col{display:flex;flex-direction:column;min-width:0;gap:1px}
.sugitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugitem .yc{font-size:10.5px;color:rgba(152,161,198,0.92);font-weight:500;letter-spacing:0.01em;

.sugempty{padding:12px 13px;font-size:12px;color:var(--sub)}
.sugitem .cnt{font-size:11px;color:#6fe3ff;background:rgba(23,212,255,0.13);border:1px solid rgba(23,212,255,0.28);

.sugitem .cnt.d{background:transparent;border-color:transparent;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{background:rgba(23,212,255,0.12);color:#8ceaff;border:1px solid rgba(23,212,255,0.30);font-size:12px;
  font-weight:600;padding:6px 11px;border-radius:99px;display:inline-flex;gap:5px;align-items:center;max-width:100%;box-shadow:none}
.chip:active{opacity:0.65}
.chip .cnt{font-size:10px;opacity:0.85}
.chip.on{background:linear-gradient(90deg,#ec38bc,#17d4ff);color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(236,56,188,0.32)}
.pf{cursor:pointer}.pf:active{opacity:0.6}
.sheet{position:fixed;inset:0;z-index:50;display:none;overflow-y:auto;padding:16px;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  background:rgba(4,6,16,0.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet.on{display:block}
.sheetbox{max-width:460px;margin:20px auto;padding:16px;background:rgba(13,18,42,0.94);
  border:1px solid rgba(255,255,255,0.12);border-radius:22px;
  box-shadow:0 30px 70px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.06)}
.sheetbox .card{background:rgba(255,255,255,0.05)}
/* ---- Muse 風レイアウト ---- */
.tophead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.logo{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;letter-spacing:0.03em}
.logo .mark{width:18px;height:18px;border-radius:6px;flex:none;

.bell{position:relative;flex:none;width:42px;height:42px;padding:0;border-radius:14px;

  display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:none}
.bell .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;

.greet{font-size:22px;margin:6px 0 14px;font-weight:800;letter-spacing:0.01em;line-height:1.35}

.searchrow{display:flex;gap:8px;margin:0 0 2px;align-items:stretch}
.searchrow input{border-radius:14px}
.searchrow button{flex:none;border-radius:14px;padding:11px 20px}
.listcard{background:var(--card);border:1px solid var(--bd);border-radius:16px;

.lrow{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid rgba(255,255,255,0.07)}
.lrow:last-child{border-bottom:0}
.lrow.tap{cursor:pointer}
.lrow.tap:active{background:rgba(23,212,255,0.07)}
.lrow .txt{flex:1;min-width:0}
.lrow .nm{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lrow .sub{display:block;margin-top:1px}
.pill{flex:none;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill.cur{color:#6fe3ff;border:1px solid rgba(23,212,255,0.45);background:rgba(23,212,255,0.10)}

.rank{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;

.shared{color:#5fd8f5;font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow.addrow{border-top:1px dashed rgba(255,255,255,0.20);border-bottom:0;color:#8ceaff;

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ページを開いた時点の URL（確認・再設定リンクから戻ってきたかの判定に使う。SDK がハッシュを消す前に控える） */
const INIT_URL = { hash: window.location.hash || "", search: window.location.search || "" };
const initialUrlHas = re => re.test(INIT_URL.hash + INIT_URL.search);
const SUPABASE_URL = "https://hhjnodkkcqzwrtpbmpig.supabase.co";
const SUPABASE_KEY = "sb_publishable_e7DZss988mAQPZ5xqrH2YQ__DPYR8Gz";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").normalize("NFKC").replace(/\s+/g, "").toLowerCase();
const GRADES = ["S","A","B","C","D","未回答"], VIS = {all:"全員に公開", same:"同じ授業の人のみ", none:"非公開"};
/* 頭文字アバターの色（ID から決まる固定色） */
const AV_CLASSES = ["av0","av1","av2","av3","av4","av5"];
const avCls = s => AV_CLASSES[Array.from(String(s || "x")).reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 997, 7) % AV_CLASSES.length];
const initial = s => String(s || "?").trim().slice(0, 1) || "?";

/* ============================================================
   アイコン（丸っこいキャラ 8 種 ＋ 自分の写真）
   キャラはインライン SVG、写真は 128x128 の JPEG DataURL。
   選択値は "mascot:blue" か "data:image/jpeg;base64,..."
   ============================================================ */
const MASCOT_DEFS = {
  blue:   { a:"#9be8ff", b:"#0a67ff", c:"#c8f4ff", t:"ブルー" },
  mint:   { a:"#a9ffe4", b:"#0eae80", c:"#ccfff0", t:"ミント" },
  pink:   { a:"#ffc2e9", b:"#e02fa8", c:"#ffdcf2", t:"ピンク" },
  violet: { a:"#d6c4ff", b:"#6a3cf0", c:"#e9dfff", t:"バイオレット" },
  amber:  { a:"#ffe8a6", b:"#f08c00", c:"#fff4cb", t:"アンバー" },
  coral:  { a:"#ffc6b8", b:"#ef4058", c:"#ffdcd3", t:"コーラル" },
  sky:    { a:"#c2f2ff", b:"#0aa2e0", c:"#e0faff", t:"スカイ" },
  prism:  { a:"#ff9ae8", b:"#7a5cff", c:"#a8ffe4", t:"プリズム",
            stops:[[0,"#ff9ae8"],[0.45,"#9c8cff"],[0.75,"#53e5ff"],[1,"#43f0b4"]] }
};
const MASCOT_IDS = ["blue","mint","pink","violet","amber","coral","sky","prism"];
const mascotOf = v => { const m = /^mascot:([a-z]+)$/.exec(String(v || "")); return m && MASCOT_DEFS[m[1]] ? m[1] : ""; };
const isPhotoVal = v => /^data:image\//.test(String(v || ""));

/* 丸い頭・キラキラの丸い目・左右の耳・ぷっくりシルエット・光る縁取り */
function renderMascot(id) {
  const k = MASCOT_DEFS[id] ? id : "blue";
  const d = MASCOT_DEFS[k];
  const gid = "mg_" + k, eid = "me_" + k;
  const stops = d.stops || [[0, d.a], [1, d.b]];
  const stopEls = stops.map(s => `<stop offset="${s[0]}" stop-color="${s[1]}"/>`).join("");
  const grad = (k === "prism")
    ? `<linearGradient id="${gid}" x1="6%" y1="2%" x2="94%" y2="98%">${stopEls}</linearGradient>`
    : `<radialGradient id="${gid}" cx="34%" cy="24%" r="86%">${stopEls}</radialGradient>`;
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">`
    + `<defs>${grad}`
    + `<radialGradient id="${eid}" cx="50%" cy="46%" r="54%">`
    + `<stop offset="0" stop-color="${d.c}" stop-opacity="0.55"/>`
    + `<stop offset="1" stop-color="${d.c}" stop-opacity="0"/></radialGradient></defs>`
    + `<circle cx="50" cy="54" r="46" fill="url(#${eid})"/>`

/* アイコンの保存先：localStorage（自分の端末）＋ profiles.avatar_url（あれば） */
const AV_KEY = "cc_avatar_";
const avCache = {};            /* userId → DB から分かった avatar 値 */
let lastMascotId = "blue";
const getLocalAvatar = uid => { try { return localStorage.getItem(AV_KEY + uid) || ""; } catch (e) { return ""; } };
const setLocalAvatar = (uid, v) => {
  try { v ? localStorage.setItem(AV_KEY + uid, v) : localStorage.removeItem(AV_KEY + uid); } catch (e) {}
};
function avatarValueOf(uid) {
  const id = String(uid || "");
  const mine = !!(session && session.user && id === session.user.id);
  if (mine) { const lv = getLocalAvatar(id); if (lv) return lv; }   /* 自分はこの端末の選択を最優先 */
  if (myProfile && myProfile.id === id && myProfile.avatar_url) return myProfile.avatar_url;
  return avCache[id] || "";
}
/* すべての丸アバターはここから描く（キャラ → 写真 → 頭文字の順） */
function avHtml(uid, name, extra, attrs) {
  const id = String(uid || "");
  const st = extra ? ` style="${extra}"` : "";
  const at = attrs || "";
  const v = avatarValueOf(id);
  const mk = mascotOf(v);
  if (mk) return `<div class="avatar mk"${at}${st} title="${esc(MASCOT_DEFS[mk].t)}">${renderMascot(mk)}</div>`;
  if (isPhotoVal(v)) return `<div class="avatar mk"${at}${st}><img src="${esc(v)}" alt=""></div>`;
  return `<div class="avatar ${avCls(id)}"${at}${st}>${esc(initial(name))}</div>`;
}
/* 他の人のアイコンをまとめて取得（avatar_url 列が無い DB でも落ちないよう select("*")） */
async function fillAvatarCache(ids) {
  const need = [...new Set((ids || []).filter(id => id && !(id in avCache)))];
  if (!need.length) return;
  try {
    const { data, error } = await sb.from("profiles").select("*").in("id", need);
    if (error) return;
    const got = {};
    (data || []).forEach(p => { if (p && p.id) got[p.id] = p.avatar_url || ""; });
    need.forEach(id => { avCache[id] = got[id] || ""; });
  } catch (e) { /* 取れなくても頭文字アバターで続行 */ }
}

function avatarLabel(v) {
  const mk = mascotOf(v);
  if (mk) return "キャラ（" + MASCOT_DEFS[mk].t + "）";
  if (isPhotoVal(v)) return "自分の写真";
  return "頭文字（未設定）";
}
function currentAvatarVal() {
  const uid = session && session.user ? session.user.id : "";
  return uid ? avatarValueOf(uid) : "";
}
/* avatar_url 列がまだ無い DB（42703）でもエラーを出さず localStorage だけで動く */
async function saveAvatarRemote(val) {
  const uid = session && session.user ? session.user.id : "";
  if (!uid) return { ok: false, code: "no-session" };
  try {
    const { error } = await sb.from("profiles").update({ avatar_url: val }).eq("id", uid);
    if (error) return { ok: false, code: String(error.code || ""), message: String(error.message || "") };
    return { ok: true };
  } catch (e) {
    return { ok: false, code: "", message: String((e && e.message) || e) };
  }
}
function paintAvatarPicker() {
  const box = $("#asbody");
  if (!box) return;

async function applyAvatar(val) {
  const uid = session && session.user ? session.user.id : "";
  if (!uid) return;
  const v = String(val || "");
  setLocalAvatar(uid, v);          /* まず端末に即保存 */

  if (myProfile) myProfile.avatar_url = v;

  paintAvatarPicker();

  if (el) el.outerHTML = avHtml(uid, (myProfile && myProfile.display_name) || "学生",
    "width:52px;height:52px;font-size:19px", ' id="myav"');
  const r = await saveAvatarRemote(v);
  const msg = $("#avmsg");
  if (msg) msg.textContent = r.ok ? "アイコンを保存しました。" : "この端末に保存しました。";
}
/* 写真 → 128x128 の正方形クロップ → JPEG（quality 0.72 目安、10KB 前後） */
const AV_SIZE = 128;
function fileToAvatar(file) {
  return new Promise((resolve, reject) => {
    let url = "";
    const finish = fn => { try { if (url) URL.revokeObjectURL(url); } catch (e) {} fn(); };
    try { url = URL.createObjectURL(file); } catch (e) { reject(e); return; }
    const img = new Image();
    img.onload = () => finish(() => {
      try {
        const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) { reject(new Error("empty")); return; }
        const cv = document.createElement("canvas");
        cv.width = AV_SIZE; cv.height = AV_SIZE;
        const ctx = cv.getContext("2d");
        const side = Math.min(w, h);
        ctx.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, AV_SIZE, AV_SIZE);
        let q = 0.72, out = cv.toDataURL("image/jpeg", q);
        while (out.length > 14000 && q > 0.42) {
          q = Math.round((q - 0.08) * 100) / 100;
          out = cv.toDataURL("image/jpeg", q);
        }
        resolve(out);
      } catch (e) { reject(e); }
    });
    img.onerror = () => finish(() => reject(new Error("decode")));
    img.src = url;
  });
}
async function onAvatarFile(e) {
  const input = e && e.target ? e.target : $("#avfile");
  const file = input && input.files ? input.files[0] : null;
  if (input) { try { input.value = ""; } catch (err) {} }   /* 同じ写真をもう一度選べるように */
  if (!file) return;
  const msg = $("#avmsg");
  if (msg) msg.textContent = "写真を読み込み中…";
  try {
    const dataUrl = await fileToAvatar(file);
    const before = mascotOf(currentAvatarVal());
    if (before) lastMascotId = before;
    await applyAvatar(dataUrl);
    if (msg) msg.textContent = "この写真をアイコンにしました。";
  } catch (err) {
    if (msg) msg.textContent = "この写真は読み込めませんでした。別の写真を選んでください。";
  }
}

/* ============================================================
   あかさたな順（五十音順）の候補ピッカー
   入力欄をタップ／入力すると、下に候補がよみ順でズラッと開く。
   漢字の音読み・訓読みでズレないよう、候補は必ず「よみ」で並べる。
   ============================================================ */
const toHira = s => String(s ?? "").normalize("NFKC")
  .replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
/* "名前|よみ" の行から候補配列を作る */
const parseAka = txt => txt.trim().split("\n").map(line => {
  const i = line.indexOf("|");
  return i < 0 ? { n: line.trim(), y: "" } : { n: line.slice(0, i).trim(), y: line.slice(i + 1).trim() };
}).filter(x => !!x.n);
const ROW_ORDER = ["あ行","か行","さ行","た行","な行","は行","ま行","や行","ら行","わ行","英数","他"];
function gojuonRow(y) {
  const c = toHira(y).charAt(0);
  if (!c) return "他";
  if (/[あ-おぁ-ぉゔ]/.test(c)) return "あ行";
  if (/[か-ご]/.test(c)) return "か行";
  if (/[さ-ぞ]/.test(c)) return "さ行";
  if (/[た-どっ]/.test(c)) return "た行";
  if (/[な-の]/.test(c)) return "な行";
  if (/[は-ぽ]/.test(c)) return "は行";
  if (/[ま-も]/.test(c)) return "ま行";
  if (/[や-よゃ-ょ]/.test(c)) return "や行";
  if (/[ら-ろ]/.test(c)) return "ら行";
  if (/[わ-んゎゐゑ]/.test(c)) return "わ行";
  if (/[a-z0-9]/.test(c)) return "英数";
  return "他";
}
/* よみの五十音順で並べる（よみが同じなら漢字名で安定化） */
function akaSort(list) {
  return list.map((x, i) => ({ x, i })).sort((a, b) => {
    const ra = ROW_ORDER.indexOf(gojuonRow(a.x.y)), rb = ROW_ORDER.indexOf(gojuonRow(b.x.y));
    if (ra !== rb) return ra - rb;
    const c = toHira(a.x.y).localeCompare(toHira(b.x.y), "ja");
    if (c) return c;
    const d = String(a.x.n).localeCompare(String(b.x.n), "ja");
    return d || a.i - b.i;
  }).map(o => o.x);
}
function akaUniq(list) {
  const seen = new Set(), out = [];
  list.forEach(x => {
    const k = norm(x.n);
    if (!k || !x.n || seen.has(k)) return;
    seen.add(k); out.push(x);
  });
  return out;
}
/* 名前でもよみでも絞り込む（ひらがな・カタカナ・漢字すべて可） */
function akaHit(x, q) {
  const raw = String(q || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "");
  if (!raw) return true;
  const qh = toHira(raw);
  return toHira(norm(x.n)).includes(qh) || toHira(norm(x.y)).includes(qh);
}
function hideAka(listEl) {
  if (listEl) { listEl.classList.remove("on"); listEl.innerHTML = ""; }
}
const AKA_LIMIT = 400;
function drawAkaList(listEl, items, input) {
  let row = "", html = "";
  const curK = norm(input.value);
  items.slice(0, AKA_LIMIT).forEach(it => {
    /* grp がある候補（他のユーザーが登録した授業など）はその見出しでまとめる */
    const r = it.grp || gojuonRow(it.y);
    if (r !== row) { html += `<div class="sughead">${esc(r)}</div>`; row = r; }
    const on = curK && norm(it.n) === curK;
    html += `<button type="button" class="sugitem${on ? " cur" : ""}" data-pick="${esc(it.n)}">`
      + `<span class="col"><span class="nm">${esc(it.n)}</span>${it.y && !it.grp ? `<span class="yc">${esc(it.y)}</span>` : ""}</span>`
      + `${it.c ? `<span class="cnt">${it.c}人</span>` : ""}</button>`;
  });
  listEl.innerHTML = html || `<div class="sugempty">候補が見つかりません。そのまま入力できます。</div>`;
  listEl.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    input.value = b.dataset.pick;
    hideAka(listEl);
    if (typeof input._akaAfter === "function") input._akaAfter(b.dataset.pick);
  });
  listEl.classList.add("on");
  const cur = listEl.querySelector(".sugitem.cur");
  listEl.scrollTop = cur ? Math.max(0, cur.offsetTop - listEl.clientHeight / 2) : 0;
}
/* 入力欄と候補リストを結びつける。itemsFn は開くたびに呼ばれる */
function bindAka(input, listEl, itemsFn) {
  if (!input || !listEl) return;
  const draw = () => {
    const rawItems = itemsFn() || [];
    const grpItems = rawItems.filter(x => x.grp);
    const plain = akaSort(akaUniq(rawItems.filter(x => !x.grp)));
    const raw = String(input.value || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "");
    const k = norm(input.value);
    const exact = !!k && rawItems.some(x => norm(x.n) === k);
    let items = plain;
    if (!exact && raw) {
      /* 入力があるときは前方一致を先に、その中は五十音順 */
      const qh = toHira(raw);
      const hits = plain.filter(x => akaHit(x, input.value));
      const pre = hits.filter(x => toHira(norm(x.y)).startsWith(qh) || toHira(norm(x.n)).startsWith(qh));
      items = pre.concat(hits.filter(x => pre.indexOf(x) < 0));
    }
    drawAkaList(listEl, akaUniq(grpItems).concat(items), input);
  };
  input._akaDraw = draw;
  input.addEventListener("focus", draw);
  input.addEventListener("click", draw);
  input.addEventListener("input", draw);
  input.addEventListener("keydown", e => { if (e.key === "Escape") hideAka(listEl); });
}

[UNIV_LIST, GENERIC_DEPTS, GENERIC_COURSES].forEach(arr =>
  arr.forEach(x => { const k = norm(x.n); if (k && x.y && !YOMI_INDEX.has(k)) YOMI_INDEX.set(k, x.y); }));
Object.keys(RIKKYO_FAC_COURSES).forEach(f => RIKKYO_FAC_COURSES[f].forEach(x => {
  const k = norm(x.n); if (k && x.y && !YOMI_INDEX.has(k)) YOMI_INDEX.set(k, x.y);
}));
COMMON_COURSES.forEach(x => { const k = norm(x.n); if (k && x.y && !YOMI_INDEX.has(k)) YOMI_INDEX.set(k, x.y); });
RIKKYO_FAC.forEach(f => {
  if (!YOMI_INDEX.has(norm(f.n))) YOMI_INDEX.set(norm(f.n), f.y);
  f.d.forEach(d => { if (!YOMI_INDEX.has(norm(d[0]))) YOMI_INDEX.set(norm(d[0]), d[1]); });
});
const yomiFor = name => YOMI_INDEX.get(norm(name)) || "";

/* ============================================================
   状態とリロード保持（cc_ui_state）
   ============================================================ */
let session = null, myProfile = null, myCourses = [];
let tab = "home", openTid = null, openPeer = null, openCourse = "";
let fil = "all", homeQuery = "", q = "", cfil = "";
let authMode = "login", authErr = "", authOk = "", authEmail = "", recoveryDone = false;
let recoveryInvalid = false, recoveryTimer = null;
let signupConfirmPending = initialUrlHas(/type=signup/), signupTimer = null;
let rtChannel = null;

const UI_KEY = "cc_ui_state";
const TABS = ["home","search","dm","profile"];
function loadUIState() {
  try {
    const s = JSON.parse(localStorage.getItem(UI_KEY) || "null");
    if (!s || typeof s !== "object") return;
    if (typeof s.tab === "string" && TABS.indexOf(s.tab) >= 0) tab = s.tab;
    if (typeof s.openTid === "string" && s.openTid) openTid = s.openTid;
    if (typeof s.fil === "string" && ["all","current","done"].indexOf(s.fil) >= 0) fil = s.fil;
    if (typeof s.homeQuery === "string") homeQuery = s.homeQuery;
    if (typeof s.q === "string") q = s.q;
    if (typeof s.cfil === "string") cfil = s.cfil;
  } catch (e) { /* 読めないときは初期状態 */ }
}
function saveUIState() {
  try { localStorage.setItem(UI_KEY, JSON.stringify({ tab, openTid, fil, homeQuery, q, cfil })); } catch (e) {}
}
function clearUIState() {
  try { localStorage.removeItem(UI_KEY); } catch (e) {}
  tab = "home"; openTid = null; fil = "all"; homeQuery = ""; q = ""; cfil = "";
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  if (tab !== "dm") openTid = null;
  saveUIState(); render();
});

async function loadMine() {
  const uid = session.user.id;
  const { data: prof } = await sb.from("profiles").select("*").eq("id", uid).single();
  myProfile = prof || { id: uid, display_name: "学生", university: "", department: "", year: "", verified: true };
  if (prof) avCache[uid] = prof.avatar_url || "";
  const { data: cs } = await sb.from("user_courses").select("*").eq("user_id", uid).order("created_at");
  myCourses = cs || [];
}

async function render() {
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (signupConfirmPending) {
    if (session) {
      /* 確認メールのリンクから戻ってきてセッションが確立できた */
      signupConfirmPending = false; clearTimeout(signupTimer);
      authMode = "signupDone"; authErr = ""; authOk = "";
      clearAuthUrl();
      $("#nav").style.display = "none";
      rSignupDone(); return;
    }
    /* ハッシュのトークン解析中かもしれません。少しだけ待つ */
    $("#nav").style.display = "none";
    $("#app").innerHTML = `<div style="text-align:center;margin:48px 0"><h1 style="font-size:20px;margin:0">メール認証を確認しています…</h1></div>`;
    clearTimeout(signupTimer);
    signupTimer = setTimeout(() => {
      if (!signupConfirmPending) return;
      signupConfirmPending = false;
      authMode = "login"; authErr = SIGNUP_LINK_INVALID_MSG; authOk = "";
      clearAuthUrl(); render();
    }, 2500);
    return;
  }
  if (!session || authMode === "recovery" || authMode === "signupDone") { $("#nav").style.display = "none"; rAuth(); return; }
  $("#nav").style.display = "flex";
  if (!myProfile) await loadMine();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  ({ home: rHome, search: rSearch, dm: rDM, profile: rProfile })[tab]();
}

/* 同じ大学・同じ授業の他の学生（peer_courses ビュー） */
async function fetchPeers() {
  const mine = myCourses.map(c => norm(c.course_name));
  if (!mine.length) return [];
  const { data } = await sb.from("peer_courses").select("*").neq("user_id", session.user.id);
  let rows = (data || []).filter(p => mine.indexOf(norm(p.course_name)) >= 0);
  if (myProfile && myProfile.university) rows = rows.filter(p => norm(p.university) === norm(myProfile.university));
  await fillAvatarCache(rows.map(p => p.user_id));
  return rows;
}
/* DMスレッド（相手の名前つき） */
async function fetchThreads() {
  const uid = session.user.id;
  const { data: ths } = await sb.from("threads").select("*")
    .or(`user_a.eq.${uid},user_b.eq.${uid}`).order("last_message_at", { ascending: false, nullsFirst: false });
  const threads = ths || [];
  const ids = [...new Set(threads.flatMap(t => [t.user_a, t.user_b]))].filter(id => id !== uid);
  let profs = {};
  if (ids.length) {
    const { data: ps } = await sb.from("profiles").select("*").in("id", ids);
    profs = {};
    (ps || []).forEach(p => { profs[p.id] = p; avCache[p.id] = p.avatar_url || ""; });
  }
  return threads.map(t => {
    const oid = t.user_a === uid ? t.user_b : t.user_a;
    const p = profs[oid] || {};
    return { id: t.id, oid, name: p.display_name || "ユーザー", year: p.year, department: p.department,
             course: t.course_name || "", last: t.last_message || "", at: t.last_message_at };
  });
}
/* 学年の関係：先輩／同期／後輩 */
function relTag(year) {
  const y0 = parseInt(myProfile && myProfile.year, 10), yp = parseInt(year, 10);
  if (!y0 || !yp) return "";
  if (yp > y0) return "先輩";   /* 年次が上 = 先輩 */
  if (yp < y0) return "後輩";   /* 年次が下 = 後輩 */
  return "同期";
}
/* 成績タグ（公開範囲を尊重） */
function gradeTag(c) {
  if (!c || c.status !== "done") return "";
  const vis = c.visibility;
  if (vis === "none") return "";
  if (vis === "same") {
    const shared = myCourses.some(m => norm(m.course_name) === norm(c.course_name));
    if (!shared) return "";
  }
  const g = c.grade && c.grade !== "未回答" ? c.grade : "";
  return g ? `<span class="rank">${esc(g)}ランク帯</span>` : "";
}
function statusPill(status) {
  return status === "done" ? `<span class="pill done">履修済み</span>` : `<span class="pill cur">受講中</span>`;
}

    <div class="sub" style="margin:0 0 8px">直近のDM</div>

        <div class="lrow tap" data-tid="${esc(t.id)}">

          <div class="txt"><span class="nm">${esc(t.name)}</span>

async function rSearch() {
  $("#app").innerHTML = `<div class="tabtitle">さがす</div><p class="sub">読み込み中…</p>`;
  const peers = await fetchPeers();
  const qk = String(q || "").normalize("NFKC").toLowerCase().trim();
  let rows = peers.filter(p => {
    if (qk) {
      const hay = (String(p.display_name || "") + " " + String(p.course_name || "")).normalize("NFKC").toLowerCase();
      if (hay.indexOf(qk) < 0) return false;
    }
    if (cfil && norm(p.course_name) !== norm(cfil)) return false;
    if (fil !== "all" && p.status !== fil) return false;
    return true;
  });
  const byName = (a, b) => String(a.display_name || "").localeCompare(String(b.display_name || ""), "ja")
    || String(a.course_name).localeCompare(String(b.course_name), "ja");
  rows = rows.slice().sort(byName);

  const chips = [`<button class="chip ${cfil ? "" : "on"}" data-cf="">すべて</button>`]
    .concat(myCourses.map(c => `<button class="chip ${norm(cfil) === norm(c.course_name) ? "on" : ""}" data-cf="${esc(c.course_name)}">${esc(c.course_name)}</button>`))
    .join("");
  const seg = [["all","すべて"],["current","受講中"],["done","履修済み"]]
    .map(([v, l]) => `<button class="chip ${fil === v ? "on" : ""}" data-fl="${v}">${l}</button>`).join("");

  const list = rows.map(p => {
    const rel = relTag(p.year);
    return `<div class="lrow tap" data-pf="${esc(p.user_id)}">
      ${avHtml(p.user_id, p.display_name)}
      <div class="txt">
        <span class="nm">${esc(p.display_name || "ユーザー")}${rel ? `<span class="tag">${esc(rel)}</span>` : ""}${gradeTag(p)}</span>
        <span class="sub">${esc(p.department || "学部未設定")}${p.year ? " " + esc(p.year) + "年" : ""}</span>
        <div class="shared">共通：${esc(p.course_name)}（${p.status === "done" ? "履修済み" : "受講中"}）</div>
      </div>
      <span class="chev">›</span>
    </div>`;
  }).join("");

  $("#app").innerHTML = `
    <div class="tabtitle">さがす</div>
    <div class="searchrow" style="margin-bottom:12px">
      <input id="sq" placeholder="名前・授業名でさがす" value="${esc(q)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="sub" style="margin:0 0 6px;font-weight:700;color:#dde3ff">授業でしぼりこむ</div>
    <div class="chips" id="cfchips">${myCourses.length ? chips : `<button class="chip on" data-cf="">すべて</button>`}</div>
    <div class="segrow" id="flchips">${seg}</div>
    <div class="listcard">
      ${list || `<div class="empty">${myCourses.length ? "条件に合う学生が見つかりませんでした。" : "先に「マイページ」で授業を登録してください。"}</div>`}
    </div>`;

  const sq = $("#sq");
  sq.addEventListener("input", () => { q = sq.value; });
  sq.addEventListener("keydown", e => { if (e.key === "Enter") { q = sq.value; saveUIState(); render(); } });
  sq.addEventListener("blur", () => { if (q !== sq.value) { q = sq.value; saveUIState(); render(); } });
  document.querySelectorAll("#cfchips [data-cf]").forEach(b => b.onclick = () => {
    cfil = b.dataset.cf; saveUIState(); render();
  });
  document.querySelectorAll("#flchips [data-fl]").forEach(b => b.onclick = () => {
    fil = b.dataset.fl; saveUIState(); render();
  });
  document.querySelectorAll("#app [data-pf]").forEach(el => el.onclick = () => openPeerProfile(el.dataset.pf));
}

async function startDM(otherId, course) {
  const uid = session.user.id;
  const [a, b] = [uid, otherId].sort();
  const { data, error } = await sb.from("threads")
    .upsert({ course_name: course, user_a: a, user_b: b }, { onConflict: "course_name,user_a,user_b" })
    .select().single();
  if (error) { alert("スレッドを作成できませんでした: " + error.message); return; }
  tab = "dm"; openTid = data.id; saveUIState(); render();
}

/* ============================================================
   DM
   ============================================================ */
async function rDM() {
  if (openTid) return rChat();
  const threads = await fetchThreads();
  const list = threads.map(t => {
    const rel = relTag(t.year);
    return `<div class="lrow tap" data-tid="${esc(t.id)}">
      ${avHtml(t.oid, t.name)}
      <div class="txt">
        <span class="nm">${esc(t.name)}${rel ? `<span class="tag">${esc(rel)}</span>` : ""}</span>
        <span class="sub dmline">${t.course ? esc(t.course) + " ｜ " : ""}${esc(t.last || "（まだメッセージなし）")}</span>
      </div>
      <span class="chev">›</span>
    </div>`;
  }).join("");
  $("#app").innerHTML = `<div class="tabtitle">DM</div>
    <div class="listcard">${list || `<div class="empty">「さがす」から相談相手を選んでみましょう。</div>`}</div>`;
  document.querySelectorAll("#app [data-tid]").forEach(el => el.onclick = () => {
    openTid = el.dataset.tid; saveUIState(); render();
  });
  const nav = $("#ndot"); if (nav) nav.classList.toggle("on", threads.length > 0);
}

async function rChat() {
  const uid = session.user.id;
  const { data: t } = await sb.from("threads").select("*").eq("id", openTid).single();
  if (!t) { openTid = null; saveUIState(); render(); return; } /* スレッドが無ければDM一覧へ */
  const oid = t.user_a === uid ? t.user_b : t.user_a;
  const { data: p } = await sb.from("profiles").select("*").eq("id", oid).single();
  openPeer = p; openCourse = t.course_name;
  if (p) avCache[oid] = p.avatar_url || "";
  const { data: msgs } = await sb.from("messages").select("*").eq("thread_id", openTid).order("created_at");
  const list = msgs || [];
  $("#app").innerHTML = `<div class="row" style="margin-bottom:8px"><button class="g" id="bk" style="flex:none">←</button>${avHtml(oid, p ? p.display_name : "ユーザー", "width:36px;height:36px;font-size:15px")}<div class="tabtitle pf" style="flex:1;margin:0;font-size:20px" data-pf="${esc(oid)}">${esc(p ? p.display_name : "ユーザー")}</div></div>
  <p class="sub">${esc(t.course_name || "")} ・授業の進め方、課題、テスト対策などを相談できます。過去問そのものの転載は控えてください。</p>
  <div class="msgs" id="ms">${list.map(m => `<div class="m ${m.sender_id === uid ? "me" : ""}">${esc(m.body)}</div>`).join("")}</div>
  <div class="row"><textarea id="tx" rows="2" placeholder="メッセージを入力…"></textarea><button id="sd">送信</button></div>`;
  const box = $("#ms"); if (box) box.scrollTop = box.scrollHeight;
  const pfh = $("[data-pf]"); if (pfh) pfh.onclick = () => openPeerProfile(oid);
  const titleEl = $("#app .tabtitle"); if (titleEl) { titleEl.classList.add("pf"); titleEl.onclick = () => openPeerProfile(oid); }
  $("#bk").onclick = () => { openTid = null; if (rtChannel) { sb.removeChannel(rtChannel); rtChannel = null; } saveUIState(); render(); };
  $("#sd").onclick = async () => {
    const v = $("#tx").value.trim(); if (!v) return;
    const { error } = await sb.from("messages").insert({ thread_id: openTid, sender_id: uid, body: v });
    if (error) { alert("送信できませんでした: " + error.message); return; }
    render();
  };
  if (rtChannel) sb.removeChannel(rtChannel);
  rtChannel = sb.channel("dm-" + openTid)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "thread_id=eq." + openTid },
      payload => { if (payload.new.sender_id !== uid && openTid) render(); })
    .subscribe();
}

function gradeLabel(c, mine) {
  if (c.status !== "done") return "";
  const vis = c.visibility;

  return "成績 " + (c.grade || "未回答");
}

/* ============================================================
   大学 → 学部 → 学科 → 授業 の候補
   ============================================================ */
let hints = { key: null, univ: "", peers: [], depts: {}, loading: false };
const isRikkyo = univ => /立教/.test(String(univ || ""));
const defaultCourses = univ => (isRikkyo(univ) ? COMMON_COURSES : GENERIC_COURSES);

/* 大学の学部一覧（立教は全学部、他大学は汎用＋登録済み） */
function facCandidates() {
  const univ = ($("#univ") && $("#univ").value) || (myProfile && myProfile.university) || "";
  if (isRikkyo(univ)) return RIKKYO_FAC.map(f => ({ n: f.n, y: f.y }));
  const seen = new Set(), out = [];
  GENERIC_DEPTS.forEach(x => {
    const fac = x.n.split(" ")[0];
    if (!seen.has(fac)) { seen.add(fac); out.push({ n: fac, y: yomiFor(fac) }); }
  });
  ((hints.depts && hints.depts[norm(univ)]) || []).forEach(d => {
    const fac = String(d.name).split(" ")[0];
    if (fac && !seen.has(fac)) { seen.add(fac); out.push({ n: fac, y: yomiFor(fac) }); }
  });
  return out;
}

/* 学部の学科一覧（学部を選ぶと絞られる） */
function depCandidates() {
  const univ = ($("#univ") && $("#univ").value) || (myProfile && myProfile.university) || "";
  const fac = ($("#fac") && $("#fac").value || "").trim();
  const out = [];
  if (isRikkyo(univ)) {
    RIKKYO_FAC.forEach(f => {
      if (fac && f.n !== fac) return;
      f.d.forEach(d => out.push({ n: d[0], y: d[1] }));
    });
  }
  GENERIC_DEPTS.forEach(x => {
    const i = x.n.indexOf(" ");
    const fx = i < 0 ? x.n : x.n.slice(0, i), dx = i < 0 ? "" : x.n.slice(i + 1);
    if (!dx) return;
    if (fac && fx !== fac) return;
    out.push({ n: dx, y: x.y });
  });
  ((hints.depts && hints.depts[norm(univ)]) || []).forEach(d => {
    const s = String(d.name);
    const fx = fac && s.indexOf(fac) === 0 ? fac : "";
    const dx = fx ? s.slice(fac.length).trim() : (s.split(" ").length > 1 ? s.split(" ").slice(1).join(" ") : "");
    if (!dx) return;
    out.push({ n: dx, y: yomiFor(dx), grp: "同じ大学の登録学科" });
  });
  return out;
}

/* 現在の学部の専門科目 */
function facCourses() {
  const univ = ($("#univ") && $("#univ").value) || (myProfile && myProfile.university) || "";
  const fac = ($("#fac") && $("#fac").value || "").trim();
  if (!isRikkyo(univ)) return [];
  if (fac && RIKKYO_FAC_COURSES[fac]) return RIKKYO_FAC_COURSES[fac];
  /* 学部未選択：学籍の学部、なければ全学部の科目を薄く混ぜず共通科目だけ */
  const pf = facFromDepartment(myProfile && myProfile.department).fac;
  return (pf && RIKKYO_FAC_COURSES[pf]) || [];
}

/* 授業名の候補：同じ大学の登録授業 → 学部の専門科目 → 全学共通 */
function courseCandidates() {
  const registered = new Set((myCourses || []).map(c => norm(c.course_name)));
  const out = [], seen = new Set();
  const put = (name, count, grp) => {
    const k = norm(name);
    if (!k || registered.has(k) || seen.has(k)) return;
    seen.add(k); out.push({ n: String(name).trim(), y: yomiFor(name), c: count || 0, grp: grp || "" });
  };
  hints.peers.forEach(p => put(p.name, p.count, "同じ大学の登録授業"));
  facCourses().forEach(x => put(x.n, 0));
  const univ = ($("#univ") && $("#univ").value) || (myProfile && myProfile.university) || "";
  defaultCourses(univ).forEach(x => put(x.n, 0));
  return out;
}

function facFromDepartment(dept) {
  const s = String(dept || "").trim();
  if (!s) return { fac: "", dep: "" };
  const all = RIKKYO_FAC.map(f => [f.n, f.d]);
  let best = { fac: "", dep: "" };
  all.forEach(([fn, deps]) => {
    if (s.indexOf(fn) === 0) {
      const rest = s.slice(fn.length).trim();
      if (!best.fac || fn.length > best.fac.length) best = { fac: fn, dep: rest };
    }
  });
  if (best.fac) return best;
  const i = s.indexOf(" ");
  if (i > 0) return { fac: s.slice(0, i), dep: s.slice(i + 1).trim() };
  return { fac: s, dep: "" };
}

/* 同じ大学の他ユーザーが登録した授業（人数つき）と、学部・学科を取得 */
async function loadCourseHints() {
  const univ = String((myProfile && myProfile.university) || "").trim();
  const key = norm(univ);
  if (hints.key === key) return;
  hints = { key, univ, peers: [], depts: {}, loading: !!key };
  renderCourseHintAreas();
  if (!key) return;
  const uid = session && session.user ? session.user.id : "";
  let data = [], error = null;
  try { ({ data, error } = await sb.from("peer_courses").select("course_name,university,user_id,department").limit(2000)); }
  catch (e) { error = e; }
  if (hints.key !== key) return; /* 取得中に大学が変わった */
  if (!error) {
    const m = new Map(), depts = {};
    (data || []).forEach(p => {
      if (!p) return;
      const uk = norm(p.university);
      const d = String(p.department || "").trim();
      if (uk && d) {
        const dm = depts[uk] || (depts[uk] = new Map());
        const dk = norm(d);
        const de = dm.get(dk) || { name: d, users: new Set() };
        de.users.add(p.user_id); dm.set(dk, de);
      }
      if (uk !== key || !p.course_name || p.user_id === uid) return;
      const k = norm(p.course_name);
      let e = m.get(k);
      if (!e) { e = { name: String(p.course_name).trim(), users: new Set() }; m.set(k, e); }
      e.users.add(p.user_id);
    });
    hints.peers = Array.from(m.values())
      .sort((a, b) => b.users.size - a.users.size || a.name.localeCompare(b.name, "ja"))
      .map(e => ({ name: e.name, count: e.users.size }));
    Object.keys(depts).forEach(k => {
      depts[k] = Array.from(depts[k].values()).map(e => ({ name: e.name, count: e.users.size }));
    });
    hints.depts = depts;
  }
  hints.loading = false;
  renderCourseHintAreas();
}

function renderCourseHintAreas() {
  const cap = $("#cncap");
  if (cap) cap.textContent = "入力欄をタップすると、同じ大学の登録授業・学部の科目・全学共通の候補があかさたな順で出ます。";
  const inp = $("#cn"), list = $("#cnlist");
  if (inp && inp._akaDraw && list && list.classList.contains("on")) inp._akaDraw();
  const dinp = $("#dep"), dlist = $("#deplist");
  if (dinp && dinp._akaDraw && dlist && dlist.classList.contains("on")) dinp._akaDraw();
}

  </div>`;
  $("#m_login").onclick = () => { authMode = "login"; authErr = ""; authOk = ""; render(); };
  $("#m_reg").onclick = () => { authMode = "register"; authErr = ""; authOk = ""; render(); };
  if (isReg) bindAka($("#a_univ"), $("#a_univlist"), () => UNIV_LIST);
  if (!isReg) $("#a_forgot").onclick = () => {
    authEmail = ($("#a_email").value || "").trim().toLowerCase();
    authMode = "forgot"; authErr = ""; authOk = ""; render();
  };
  $("#a_submit").onclick = async () => {
    const email = $("#a_email").value.trim().toLowerCase();
    const pass = $("#a_pass").value;
    authErr = ""; authOk = "";
    if (!email || !email.includes("@")) { authErr = "メールアドレスを入力してください。"; render(); return; }
    if (!isUnivEmail(email)) { authErr = "学生限定のため、大学ドメイン（.ac.jp など）のメールで登録してください。"; render(); return; }
    authEmail = email;
    if (isReg) {
      const name = $("#a_name").value.trim();
      const univ = $("#a_univ").value.trim();
      if (!name || !univ) { authErr = "表示名と大学名を入力してください。"; render(); return; }
      if (pass.length < 6) { authErr = "パスワードは6文字以上で入力してください。"; render(); return; }
      const btn = $("#a_submit"); if (btn) { btn.disabled = true; btn.textContent = "登録中…"; }
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: {
        data: { display_name: name, university: univ },
        emailRedirectTo: window.location.origin + window.location.pathname
      } });
      if (error) {
        authErr = /already\s*registered/i.test(error.message || "") ? DUP_MSG : error.message;
        render(); return;
      }
      if (data?.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
        authErr = DUP_MSG; render(); return;
      }
      if (!data.session) {
        /* メール確認待ち：メール内のリンクを開いてからログインしてもらう */
        setMailKind("signup");
        authOk = "確認メールを送りました。メール内のリンクを開いてからログインしてください。";
        authMode = "login"; render(); return;
      }
      myProfile = null; tab = "profile"; saveUIState(); render();
    } else {
      const btn = $("#a_submit"); if (btn) { btn.disabled = true; btn.textContent = "ログイン中…"; }
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) { authErr = "メールアドレスまたはパスワードが違います。"; render(); return; }
      myProfile = null;
      /* 初回ログインはホームから。保存された画面があればそれを復元する */
      tab = "home"; openTid = null; saveUIState(); render();
    }
  };
}

/* 確認メールのリンクから戻ってきたときの完了画面 */
function rSignupDone() {
  const email = session?.user?.email || authEmail || "";
  $("#app").innerHTML = `
  <div style="text-align:center;margin:12px 0 18px">
    <h1 style="font-size:22px;margin:0">メール認証が完了しました</h1>
    <p class="sub" style="margin:4px 0 0">${esc(email)}</p>
  </div>
  <div class="card">
    <div class="okmsg" style="font-size:16px;font-weight:700;text-align:center">${esc(SIGNUP_DONE_MSG)}</div>
    <p class="sub" style="margin:10px 0 0;text-align:center">つぎはプロフィールを設定して、同じ授業の人とつながりましょう。</p>
    <p style="margin:16px 0 0"><button id="a_start" style="width:100%">プロフィールを設定して始める</button></p>
  </div>`;
  $("#a_start").onclick = () => {
    authMode = "login"; authErr = ""; authOk = ""; myProfile = null; tab = "profile"; saveUIState(); render();
  };
}

/* パスワード再設定メールの送信 */
function rForgot() {
  $("#app").innerHTML = `
  <div style="margin:8px 0 18px">
    <h1 style="font-size:22px;margin:0 0 4px">パスワード再設定</h1>
    <p class="sub" style="margin:0">登録した大学メールアドレスに再設定用のリンクを送ります</p>
  </div>
  <div class="card">
    <label>大学メールアドレス</label>
    <input id="a_email" type="email" placeholder="例：taro@rikkyo.ac.jp" value="${esc(authEmail)}">
    ${authErr ? `<div class="err">${esc(authErr)}</div>` : ""}
    ${authOk ? `<div class="okmsg">${esc(authOk)}</div>` : ""}
    <p style="margin:12px 0 0"><button id="a_send" style="width:100%">リセットメールを送信</button></p>
    <p style="margin:6px 0 0;text-align:center"><button class="x" id="a_back">ログインに戻る</button></p>
  </div>`;
  $("#a_back").onclick = () => { authMode = "login"; authErr = ""; authOk = ""; render(); };
  $("#a_send").onclick = async () => {
    const email = $("#a_email").value.trim().toLowerCase();
    authErr = ""; authOk = "";
    if (!email || !email.includes("@")) { authErr = "メールアドレスを入力してください。"; render(); return; }
    if (!isUnivEmail(email)) { authErr = "学生限定のため、大学ドメイン（.ac.jp など）のメールを入力してください。"; render(); return; }
    authEmail = email;
    const btn = $("#a_send"); if (btn) { btn.disabled = true; btn.textContent = "送信中…"; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    if (error) {
      authErr = /security purposes|rate.?limit/i.test(error.message || "")
        ? "送信回数が上限に達しました。しばらく待ってからもう一度お試しください。"
        : "送信できませんでした: " + error.message;
      render(); return;
    }
    setMailKind("recovery");
    authOk = RESET_SENT_MSG; render();
  };
}

/* メール内リンクからの新しいパスワード設定 */
function rRecovery() {
  if (recoveryDone) {
    $("#app").innerHTML = `
    <div style="text-align:center;margin:12px 0 18px">
      <h1 style="font-size:22px;margin:0">パスワード再設定</h1>
    </div>
    <div class="card">
      <div class="okmsg">パスワードを更新しました。</div>
      <p style="margin:12px 0 0"><button id="a_go" style="width:100%">アプリを使いはじめる</button></p>
    </div>`;
    $("#a_go").onclick = () => {
      authMode = "login"; authErr = ""; authOk = ""; recoveryDone = false;
      myProfile = null; tab = "home"; clearAuthUrl(); saveUIState(); render();
    };
    return;
  }
  const hasSession = !!session;
  if (!hasSession && !recoveryInvalid) {
    $("#app").innerHTML = `
    <div style="text-align:center;margin:12px 0 18px">
      <h1 style="font-size:22px;margin:0">新しいパスワードを設定</h1>
      <p class="sub" style="margin:4px 0 0">再設定用のリンクを確認しています…</p>
    </div>`;
    clearTimeout(recoveryTimer);
    recoveryTimer = setTimeout(() => {
      if (authMode === "recovery" && !recoveryDone) { recoveryInvalid = true; render(); }
    }, 2500);
    return;
  }
  $("#app").innerHTML = `
  <div style="margin:8px 0 18px">
    <h1 style="font-size:22px;margin:0 0 4px">新しいパスワードを設定</h1>
    <p class="sub" style="margin:0">${hasSession ? "6文字以上の新しいパスワードを入力してください" : "再設定用のリンクを確認できませんでした"}</p>
  </div>
  <div class="card">
  ${hasSession ? `
    <label>新しいパスワード</label><input id="a_np" type="password" placeholder="6文字以上" autocomplete="new-password">
    <label>新しいパスワード（確認）</label><input id="a_np2" type="password" placeholder="もう一度入力" autocomplete="new-password">
    ${authErr ? `<div class="err">${esc(authErr)}</div>` : ""}
    <p style="margin:12px 0 0"><button id="a_upd" style="width:100%">パスワードを更新</button></p>
  ` : `
    <div class="err">リンクが無効か、有効期限が切れています。もう一度リセットメールを送信してください。</div>
    <p style="margin:12px 0 0"><button id="a_retry" style="width:100%">リセットメールを送り直す</button></p>
  `}
  </div>`;
  if (!hasSession) {
    $("#a_retry").onclick = () => {
      authMode = "forgot"; authErr = ""; authOk = ""; recoveryInvalid = false;
      clearAuthUrl(); render();
    };
    return;
  }
  $("#a_upd").onclick = async () => {
    const p1 = $("#a_np").value, p2 = $("#a_np2").value;
    authErr = "";
    if (p1.length < 6) { authErr = "パスワードは6文字以上で入力してください。"; render(); return; }
    if (p1 !== p2) { authErr = "確認用のパスワードが一致しません。"; render(); return; }
    const btn = $("#a_upd"); if (btn) { btn.disabled = true; btn.textContent = "更新中…"; }
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) { authErr = "更新できませんでした: " + error.message; render(); return; }
    recoveryDone = true; authErr = ""; myProfile = null; tab = "home"; clearAuthUrl(); saveUIState(); render();
  };
}

sb.auth.onAuthStateChange((event) => {
  myProfile = null;
  if (event === "PASSWORD_RECOVERY") {
    authMode = "recovery"; authErr = ""; authOk = ""; recoveryDone = false;
    setTimeout(render, 0); /* コールバック内で直接fetchするとSupabaseのロックで止まることがある */
  } else if (event === "SIGNED_IN" && authErr === SIGNUP_LINK_INVALID_MSG) {
    authErr = ""; setTimeout(render, 0);
  } else if (signupConfirmPending && (event === "SIGNED_IN" || event === "USER_UPDATED" || event === "INITIAL_SESSION")) {
    setTimeout(render, 0);
  }
});
/* 期限切れ・使用済みの確認リンク／再設定リンクで戻ってきた場合 */
function authLinkError() {
  const raw = decodeURIComponent(INIT_URL.hash + "&" + INIT_URL.search);
  if (!/error=/.test(raw)) return "";
  if (!/otp_expired|access_denied|invalid|expired/i.test(raw)) return "";
  if (/type=recovery/.test(raw) || getMailKind() === "recovery")
    return "再設定用のリンクが無効か、有効期限が切れています。「パスワードを忘れた方はこちら」からもう一度送信してください。";
  return SIGNUP_LINK_INVALID_MSG;
}
const linkErr = authLinkError();
if (linkErr) signupConfirmPending = false;
if (isRecoveryUrl()) { authMode = "recovery"; authErr = ""; authOk = ""; recoveryInvalid = false; }
else if (linkErr) { authMode = "login"; authErr = linkErr; authOk = ""; clearAuthUrl(); }

/* モーダル：背景タップ・Esc でも閉じる */
{
  const pms = $("#pmodal");
  if (pms) pms.addEventListener("click", e => { if (e.target === pms) closePeerProfile(); });
  const nms = $("#nsheet");
  if (nms) nms.addEventListener("click", e => { if (e.target === nms) closeNotif(); });
  const asms = $("#asheet");
  if (asms) asms.addEventListener("click", e => { if (e.target === asms) closeAvatarPicker(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closePeerProfile(); closeNotif(); closeAvatarPicker(); } });
}

/* 保存された画面（タブ・開いていたDM・絞り込み）を復元して起動
   （パスワード再設定・メール認証のURLで開いたときは、そちらの画面を優先） */
if (!isRecoveryUrl() && !initialUrlHas(/type=signup/) && !linkErr) loadUIState();
if (openTid && tab !== "dm") openTid = null;
render();
</script>

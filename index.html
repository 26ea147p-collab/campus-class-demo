<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1f">
<title>授業つながり</title>
<style>
:root{
  --ink:#f2f4fc;
  --muted:#9198b8;
  --muted2:#6f7798;
  --line:rgba(255,255,255,.075);
  --cyan:#3ed8f6;
  --pink:#f541c9;
  --mint:#6ee7b7;
  --grad:linear-gradient(90deg,#f541c9 0%,#38c6f4 100%);
  --panel:rgba(23,29,56,.62);
  --panel2:rgba(11,15,32,.78);
  --phone-bg:
    radial-gradient(400px 300px at 2% -8%, rgba(139,92,246,.55), transparent 72%),
    radial-gradient(460px 340px at 110% 2%, rgba(56,189,248,.16), transparent 70%),
    radial-gradient(560px 480px at 106% 104%, rgba(6,182,212,.32), transparent 70%),
    linear-gradient(176deg,#0d1128 0%,#0a0e1f 48%,#0a1124 100%);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;background:#05070e;color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px 480px at 12% 2%, rgba(124,58,237,.30), transparent 62%),
    radial-gradient(520px 420px at 92% 18%, rgba(14,116,144,.16), transparent 62%),
    radial-gradient(760px 620px at 86% 98%, rgba(6,182,212,.22), transparent 66%),
    radial-gradient(520px 420px at 16% 82%, rgba(217,70,239,.12), transparent 66%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px);
  background-size:22px 22px;
}
.phone{
  position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;min-height:100vh;
  padding:calc(18px + env(safe-area-inset-top,0px)) 24px calc(120px + env(safe-area-inset-bottom,0px));
  background:var(--phone-bg);
  border-left:1px solid rgba(255,255,255,.06);
  border-right:1px solid rgba(255,255,255,.06);
  box-shadow:0 0 90px rgba(0,0,0,.6);
}
@media (min-width:560px){
  .phone{min-height:calc(100vh - 32px);margin:16px auto;border:1px solid rgba(255,255,255,.09);border-radius:30px;overflow:hidden}
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);width:100%}
input::placeholder,textarea::placeholder{color:#6c7392}
a{color:var(--cyan)}

/* ---------- header ---------- */
.brand{font-size:12px;font-weight:700;letter-spacing:.16em;color:#e8ebf7;opacity:.95}
.homehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
.hello{font-size:22px;font-weight:800;letter-spacing:.01em;line-height:1.45;margin:6px 0 16px;color:#fff}
.bell{
  flex:none;width:42px;height:42px;border-radius:50%;font-size:17px;line-height:1;
  background:radial-gradient(circle at 35% 30%, rgba(253,224,71,.30), rgba(180,120,20,.18));
  border:1px solid rgba(253,224,71,.28);box-shadow:0 0 22px rgba(253,224,71,.14);
  display:flex;align-items:center;justify-content:center;
}
.bell:active{transform:scale(.96)}

/* ---------- search ---------- */
.searchrow{display:flex;gap:8px;align-items:center}
.searchrow input{
  flex:1;min-width:0;height:46px;padding:0 15px;border-radius:14px;font-size:13px;
  background:rgba(8,11,26,.72);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.searchrow input:focus{outline:none;border-color:rgba(62,216,246,.45);box-shadow:0 0 0 3px rgba(62,216,246,.10)}
.sbtn{
  flex:none;height:46px;padding:0 20px;border-radius:14px;font-size:13px;font-weight:700;color:#04121a;
  background:linear-gradient(180deg,#59e3ff,#2dc7ee);
  box-shadow:0 8px 22px rgba(45,199,238,.32),inset 0 1px 0 rgba(255,255,255,.45);
}
.sbtn:active{filter:brightness(1.06)}

/* ---------- sections ---------- */
.sec{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:#eef1fb;margin:22px 0 10px}
.sec .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px rgba(62,216,246,.9);flex:none}
.sec .dot.pink{background:var(--pink);box-shadow:0 0 10px rgba(245,65,201,.9)}
.sec .more{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted)}

/* ---------- cards ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.04);
}
.card .rowi{padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.055);display:flex;align-items:center;gap:10px}
.card .rowi:last-child{border-bottom:0}
.cname{font-size:13.5px;font-weight:700;color:#fff;line-height:1.4}
.cmeta{font-size:11px;color:var(--muted);margin-top:2px}
.pill{
  flex:none;font-size:10.5px;font-weight:700;padding:4px 11px;border-radius:99px;white-space:nowrap;
}
.pill.cur{color:#7ce9ff;background:rgba(62,216,246,.12);border:1px solid rgba(62,216,246,.45)}
.pill.done{color:#ff8fe4;background:rgba(245,65,201,.12);border:1px solid rgba(245,65,201,.42)}
.addrow{display:flex;align-items:center;gap:12px;padding:15px;color:var(--cyan);font-weight:700;font-size:13.5px;width:100%;text-align:left}
.addrow .plus{font-size:16px;font-weight:700;line-height:1}
.addrow .asub{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:3px}

/* ---------- peer rows ---------- */
.peer{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.055);cursor:pointer}
.peer:last-child{border-bottom:0}
.peer:active{background:rgba(255,255,255,.03)}
.ava{
  flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 14px rgba(0,0,0,.3);
}
.av0{background:linear-gradient(140deg,#2ed3f5,#0f7cff)}
.av1{background:linear-gradient(140deg,#ff6fb5,#f0506e)}
.av2{background:linear-gradient(140deg,#ffb257,#ff7a3d)}
.av3{background:linear-gradient(140deg,#4ce6b0,#0fa07a)}
.av4{background:linear-gradient(140deg,#8e7bff,#5b3bff)}
.av5{background:linear-gradient(140deg,#f857f0,#8a3bff)}
.pbody{flex:1;min-width:0}
.prow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.3}
.prow b{font-size:13.5px;font-weight:700;color:#fff}
.tagx{
  font-size:10px;font-weight:600;color:#cfd6ee;padding:1px 7px;border-radius:99px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);white-space:nowrap;
}
.rank{font-size:10px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.rank.s{color:#7ef3c2;border:1px solid rgba(110,231,183,.5);background:rgba(110,231,183,.10)}
.rank.a{color:#7ef3c2;border:1px solid rgba(110,231,183,.45);background:rgba(110,231,183,.10)}
.rank.b{color:#7ce9ff;border:1px solid rgba(62,216,246,.45);background:rgba(62,216,246,.10)}
.rank.c{color:#c4a6ff;border:1px solid rgba(160,107,255,.45);background:rgba(160,107,255,.12)}
.rank.d{color:#b9c0d8;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06)}
.meta{font-size:11px;color:var(--muted);margin-top:3px}
.common{font-size:11px;color:#7fe6fb;margin-top:3px;line-height:1.45}
.chev{flex:none;color:#7e86a8;font-size:16px;line-height:1;margin-top:2px}
.empty{padding:16px;color:var(--muted);font-size:12px;line-height:1.6}

/* ---------- dm ---------- */
.seg{display:flex;gap:0;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:3px}
.seg button{flex:1;padding:9px 0;font-size:12.5px;font-weight:700;color:var(--muted);border-radius:99px;position:relative}
.seg button.on{color:#fff;background:var(--grad);box-shadow:0 6px 18px rgba(245,65,201,.26)}
.seg .ndot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#fbbf24;margin-left:5px;vertical-align:middle}
.dmline{font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmline em{color:#cfd6ee;font-style:normal}
.badge{flex:none;min-width:19px;height:19px;border-radius:99px;background:var(--pink);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;align-self:flex-start;margin-top:2px}

/* chat */
.chathead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.backbtn{flex:none;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:18px;line-height:1;color:#dfe4f7;display:flex;align-items:center;justify-content:center}
.chathead .who{min-width:0;flex:1}
.chathead b{font-size:15px}
.chathead .meta{font-size:11px}
.msgs{display:flex;flex-direction:column;gap:8px;padding:10px 2px;margin-bottom:12px;min-height:52vh}
.m{max-width:82%;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);align-self:flex-start;white-space:pre-wrap;word-break:break-word;font-size:13px}
.m.me{background:var(--grad);border-color:transparent;color:#fff;align-self:flex-end;box-shadow:0 8px 20px rgba(245,65,201,.2)}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:calc(88px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(10,14,31,0),rgba(10,14,31,.92) 40%);padding:10px 0 4px}
.composer textarea{flex:1;min-height:46px;max-height:120px;padding:12px 14px;border-radius:14px;background:rgba(8,11,26,.8);border:1px solid var(--line);resize:none;font-size:13px}
.composer textarea:focus{outline:none;border-color:rgba(62,216,246,.4)}
.send{flex:none;height:46px;padding:0 18px;border-radius:14px;font-weight:700;font-size:13px;color:#fff;background:var(--grad);box-shadow:0 8px 20px rgba(245,65,201,.28)}

/* ---------- profile ---------- */
.profcard{background:linear-gradient(135deg,rgba(76,29,149,.42),rgba(14,116,144,.22));border:1px solid rgba(160,120,255,.28);border-radius:18px;padding:14px}
.profcard .top{display:flex;align-items:center;gap:12px;cursor:pointer}
.profcard .ava{width:44px;height:44px;font-size:17px}
.profcard b{font-size:15px}
.profcard .sub{font-size:11px;color:#c3caea;margin-top:3px;line-height:1.5}
.ghostbtn{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;padding:8px 16px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#e7ebfb}
.list .rowi{cursor:default}
.rowtitle{display:flex;align-items:center;gap:10px;padding:14px 15px;border-bottom:1px solid rgba(255,255,255,.055);cursor:pointer}
.rowtitle .t{flex:1;min-width:0}
.rowtitle b{font-size:13px}
.rowtitle .sub{font-size:11px;color:var(--muted);margin-top:2px}
.xdel{flex:none;width:26px;height:26px;border-radius:8px;color:#ff9db4;background:rgba(255,90,120,.10);border:1px solid rgba(255,90,120,.26);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
label{display:block;font-size:11.5px;font-weight:700;color:#c9cfeb;margin:14px 0 6px}
label:first-child{margin-top:0}
.inp,select.inp,textarea.inp{
  width:100%;height:44px;padding:0 13px;border-radius:12px;font-size:13px;
  background:rgba(8,11,26,.72);border:1px solid var(--line);appearance:none;-webkit-appearance:none;
}
textarea.inp{height:auto;padding:11px 13px;min-height:76px;resize:vertical}
select.inp{
  background-image:linear-gradient(45deg,transparent 50%,#8f97b8 50%),linear-gradient(135deg,#8f97b8 50%,transparent 50%);
  background-position:calc(100% - 18px) calc(50% + 1px),calc(100% - 13px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;
}
.inp:focus,select.inp:focus,textarea.inp:focus{outline:none;border-color:rgba(62,216,246,.5);box-shadow:0 0 0 3px rgba(62,216,246,.10)}
option{background:#101630;color:var(--ink)}
.two{display:flex;gap:10px}
.two>div{flex:1;min-width:0}
.cta{display:block;width:100%;height:50px;border-radius:99px;font-size:14px;font-weight:800;color:#fff;background:var(--grad);box-shadow:0 10px 26px rgba(245,65,201,.28),0 4px 18px rgba(56,198,244,.18);margin-top:16px}
.cta:active{filter:brightness(1.06)}
.cta[disabled]{opacity:.6}
.sub{font-size:11.5px;color:var(--muted);line-height:1.6}
.hint{margin-top:8px}
.err{color:#ff93a8;font-size:12px;margin-top:10px;line-height:1.5}
.okmsg{color:#6ee7b7;font-size:12px;margin-top:10px;line-height:1.5}
.note{font-size:11px;color:var(--muted2);margin-top:10px;line-height:1.6}
.setrow{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid rgba(255,255,255,.055)}
.setrow:last-child{border-bottom:0}
.setrow .t{flex:1;min-width:0;font-size:13px}
.setrow .s{font-size:11px;color:var(--muted);margin-top:1px}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.16);transition:.18s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s}
.sw input:checked + span{background:var(--grad)}
.sw input:checked + span::after{transform:translateX(20px)}
.danger{color:#ff8fa6}
.foot{text-align:center;font-size:10.5px;color:var(--muted2);margin-top:22px}

/* chips / suggestions */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{
  font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:99px;max-width:100%;
  color:#8fe9ff;background:rgba(62,216,246,.10);border:1px solid rgba(62,216,246,.30);
  display:inline-flex;align-items:center;gap:5px;
}
.chip .cnt{font-size:9.5px;opacity:.85}
.chip.on{background:rgba(62,216,246,.22);border-color:rgba(62,216,246,.7);color:#c8f6ff}
.chip.ghost{color:#c6cce8;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
.chip.ghost.on{background:var(--grad);border-color:transparent;color:#fff}
.sugwrap{position:relative}
.suglist{
  position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);display:none;max-height:250px;overflow-y:auto;
  background:rgba(15,20,42,.97);border:1px solid rgba(255,255,255,.12);border-radius:14px;
  box-shadow:0 18px 44px rgba(0,0,0,.6);
}
.suglist.on{display:block}
.sugitem{display:flex;width:100%;gap:8px;align-items:center;justify-content:space-between;text-align:left;padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.sugitem:last-child{border-bottom:0}
.sugitem:active{background:rgba(62,216,246,.12)}
.sugitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugitem .cnt{flex:none;font-size:10px;color:#8fe9ff;background:rgba(62,216,246,.12);border:1px solid rgba(62,216,246,.28);border-radius:99px;padding:1px 8px}
.sugitem .cnt.d{color:var(--muted);background:transparent;border-color:transparent}

/* ---------- nav ---------- */
nav{
  position:fixed;left:50%;transform:translateX(-50%);z-index:40;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(398px,calc(100vw - 36px));display:flex;gap:4px;padding:7px;
  background:rgba(13,18,38,.9);border:1px solid rgba(255,255,255,.09);border-radius:20px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 44px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
}
nav button{flex:1;padding:10px 4px;border-radius:14px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
nav button.on{color:#fff;background:var(--grad);box-shadow:0 8px 20px rgba(245,65,201,.3)}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(5,7,15,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.sheet.on{display:block}
.pv{
  position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;width:100%;max-width:430px;
  overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 24px calc(40px + env(safe-area-inset-bottom,0px));
  background:var(--phone-bg);
}
.pvtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.pvback{font-size:13px;font-weight:700;color:#dfe4f7;padding:6px 2px}
.dots{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:14px;color:#cfd6ee}
.commonbox{padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(14,116,144,.30),rgba(76,29,149,.24));border:1px solid rgba(62,216,246,.28)}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#7fe6fb}
.commonbox .cn{font-size:14px;font-weight:800;color:#fff;margin-top:3px}
.commonbox .line{font-size:11.5px;color:#c7cfea;margin-top:4px;line-height:1.6}
.commonbox .hint{font-size:10.5px;color:#9aa2c2;margin-top:6px}
.who{display:flex;align-items:center;gap:12px;margin:18px 0 4px}
.who .ava{width:52px;height:52px;font-size:20px}
.who b{font-size:18px}
.who .meta{margin-top:4px}
.nbox{
  position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;
  background:#0c1124;border:1px solid rgba(255,255,255,.09);border-bottom:0;border-radius:22px 22px 0 0;
  padding:18px 20px calc(26px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 50px rgba(0,0,0,.6);
}
.nbox h3{font-size:14px;font-weight:800;margin-bottom:4px}
.nrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06);width:100%;text-align:left}
.nrow:last-of-type{border-bottom:0}
.nrow .t{flex:1;min-width:0}
.nrow b{font-size:13px}
.nrow .s{font-size:11px;color:var(--muted);margin-top:2px}
.emptybig{text-align:center;padding:48px 10px;color:var(--muted)}
.emptybig .big{font-size:34px;margin-bottom:10px}
</style>
</head>
<body>
<div class="phone"><main id="app"></main></div>
<nav id="nav" style="display:none">
  <button data-t="home">ホーム</button>
  <button data-t="search">さがす</button>
  <button data-t="dm">DM</button>
  <button data-t="profile">マイページ</button>
</nav>
<div class="sheet" id="pmodal"><div class="pv" id="pmbody"></div></div>
<div class="sheet" id="nmodal"><div class="nbox" id="nmbody"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ページを開いた時点の URL（確認・再設定リンクから戻ってきたかの判定に使う。SDK がハッシュを消す前に控える） */
const INIT_URL = { hash: window.location.hash || "", search: window.location.search || "" };
const initialUrlHas = re => re.test(INIT_URL.hash + INIT_URL.search);
const SUPABASE_URL = "https://hhjnodkkcqzwrtpbmpig.supabase.co";
const SUPABASE_KEY = "sb_publishable_e7DZss988mAQPZ5xqrH2YQ__DPYR8Gz";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").normalize("NFKC").replace(/\s+/g, "").toLowerCase();

/* 学部リスト（大学名の表記ゆれを吸収） */
function univKey(name){
  const n = String(name || "").trim();
  if (!n) return "";
  const hit = UNIVS.find(u => n === u.n || n.startsWith(u.n) || u.n.startsWith(n));
  return hit ? hit.n : n;
}
function facsOf(univName){
  const k = univKey(univName);
  let u = UNIVS.find(x => x.n === k);
  if (!u && univName) u = UNIVS.find(x => norm(x.n).includes(norm(univName)) || norm(univName).includes(norm(x.n)));
  return u ? u.f : [];
}
function depsOf(univName, facName){
  const f = facsOf(univName).find(x => x.n === facName);
  return f ? (f.d || []) : [];
}
const UNIV_NAMES = UNIVS.map(u => u.n);

const splitDept = (univ, department) => {
  const d = String(department || "").trim();
  if (!d) return { fac: "", dep: "" };
  const f = facsOf(univ).find(x => d === x.n || d.startsWith(x.n));
  if (f) return { fac: f.n, dep: d.slice(f.n.length).replace(/^[\s・,，、／\/|｜]+/, "").trim() };
  const parts = d.split(/[\s・,，、／\/|｜]+/).filter(Boolean);
  if (parts.length > 1) return { fac: parts[0], dep: parts.slice(1).join(" ") };
  return { fac: d, dep: "" };
};
const yearNum = y => { const n = parseInt(y, 10); return isFinite(n) ? n : 0; };

};

}

  const { data: cs } = await sb.from("user_courses").select("*").eq("user_id", uid).order("created_at");
  myCourses = cs || [];
  const s = splitDept(myProfile.university, myProfile.department);
  curUniv = myProfile.university || "";
  curFac = s.fac; curDep = s.dep;
}

async function loadBoard(force) {
  const uid = session.user.id;
  const univ = (myProfile && myProfile.university) || "";
  if (!force && boardCache.univ === univ && Date.now() - boardCache.at < 15000) return boardCache.rows;
  let { data } = await sb.from("peer_courses").select("*").limit(2000);
  let rows = data || [];
  if (univ) rows = rows.filter(r => !r.university || norm(r.university) === norm(univ));
  rows = rows.filter(r => r.user_id !== uid);
  boardCache = { univ, rows, at: Date.now() };
  return rows;
}

function groupPeers(rows) {
  const map = new Map();
  rows.forEach(r => {
    if (!r || !r.user_id) return;
    let p = map.get(r.user_id);
    if (!p) {
      p = { id: r.user_id, name: r.display_name || "ユーザー", university: r.university || "", department: r.department || "", year: r.year, courses: [] };
      map.set(r.user_id, p);
    }
    p.courses.push({ name: r.course_name, status: r.status, grade: r.grade, visibility: r.visibility });
  });
  return [...map.values()];
}

function commonCourses(p) {
  const mine = new Map(myCourses.map(c => [norm(c.course_name), c]));
  return p.courses.filter(c => mine.has(norm(c.name)));
}

    <div style="text-align:center;margin-top:12px"><button id="a_back" style="font-size:11.5px;color:var(--muted)">ログインに戻る</button></div>
  </div>`);
  $("#a_back").onclick = () => { authMode = "login"; authErr = ""; authOk = ""; render(); };
  $("#a_send").onclick = async () => {
    const email = $("#a_email").value.trim().toLowerCase();
    authErr = ""; authOk = "";
    if (!email || !email.includes("@")) { authErr = "メールアドレスを入力してください。"; render(); return; }
    if (!isUnivEmail(email)) { authErr = "学生限定のため、大学ドメイン（.ac.jp など）のメールを入力してください。"; render(); return; }
    authEmail = email;
    const btn = $("#a_send"); if (btn) { btn.disabled = true; btn.textContent = "送信中…"; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    if (error) {
      authErr = /security purposes|rate.?limit/i.test(error.message || "")
        ? "送信回数が上限に達しました。しばらく待ってからもう一度お試しください。"
        : "送信できませんでした: " + error.message;
      render(); return;
    }
    setMailKind("recovery");
    authOk = RESET_SENT_MSG; render();
  };
}

function rRecovery() {
  if (recoveryDone) {
    paint(`
    ${authHead()}
    <h1 class="hello" style="font-size:24px">パスワード再設定</h1>
    <div class="card" style="margin-top:18px;padding:16px">
      <div class="okmsg">パスワードを更新しました。</div>
      <button class="cta" id="a_go">アプリを使いはじめる</button>
    </div>`);
    $("#a_go").onclick = () => {
      authMode = "login"; authErr = ""; authOk = ""; recoveryDone = false;
      myProfile = null; tab = "home"; clearAuthUrl(); render();
    };
    return;
  }
  const hasSession = !!session;
  if (!hasSession && !recoveryInvalid) {
    paint(`${authHead()}<h1 class="hello" style="font-size:24px">新しいパスワードを設定</h1><p class="sub">再設定用のリンクを確認しています…</p>`);
    clearTimeout(recoveryTimer);
    recoveryTimer = setTimeout(() => {
      if (authMode === "recovery" && !recoveryDone) { recoveryInvalid = true; render(); }
    }, 2500);
    return;
  }
  paint(`
  ${authHead()}
  <h1 class="hello" style="font-size:24px">新しいパスワードを設定</h1>
  <p class="sub">${hasSession ? "6文字以上の新しいパスワードを入力してください。" : "再設定用のリンクを確認できませんでした。"}</p>
  <div class="card" style="margin-top:18px;padding:16px;border-color:rgba(62,216,246,.22)">
  ${hasSession ? `
    <label>新しいパスワード</label><input class="inp" id="a_np" type="password" placeholder="6文字以上" autocomplete="new-password">
    <label>新しいパスワード（確認）</label><input class="inp" id="a_np2" type="password" placeholder="もう一度入力" autocomplete="new-password">
    ${authErr ? `<div class="err">${esc(authErr)}</div>` : ""}
    <button class="cta" id="a_upd">パスワードを更新</button>
  ` : `
    <div class="err">リンクが無効か、有効期限が切れています。もう一度リセットメールを送信してください。</div>
    <button class="cta" id="a_retry">リセットメールを送り直す</button>
  `}
  </div>`);
  if (!hasSession) {
    $("#a_retry").onclick = () => { authMode = "forgot"; authErr = ""; authOk = ""; recoveryInvalid = false; clearAuthUrl(); render(); };
    return;
  }
  $("#a_upd").onclick = async () => {
    const p1 = $("#a_np").value, p2 = $("#a_np2").value;
    authErr = "";
    if (p1.length < 6) { authErr = "パスワードは6文字以上で入力してください。"; render(); return; }
    if (p1 !== p2) { authErr = "確認用のパスワードが一致しません。"; render(); return; }
    const btn = $("#a_upd"); if (btn) { btn.disabled = true; btn.textContent = "更新中…"; }
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) { authErr = "更新できませんでした: " + error.message; render(); return; }
    recoveryDone = true; authErr = ""; myProfile = null; tab = "home"; clearAuthUrl(); render();
  };
}

function courseMeta(c, counts) {
  const bits = [];
  if (c.status === "done" && c.grade && c.grade !== "未回答") bits.push("成績 " + c.grade);
  if (c.status === "done" && c.visibility) bits.push(VIS[c.visibility] || "");
  if (c.status !== "done") {
    const n = (counts && counts[norm(c.course_name)]) || 0;
    bits.push(n ? `同じ授業の人 ${n}人` : "まだ見つかっていません");
  }
  return `<div style="min-width:0;flex:1"><div class="cname">${esc(c.course_name)}</div><div class="cmeta">${esc(bits.filter(Boolean).join(" ・ ") || "登録済み")}</div></div>`;
}

function peerCard(p, commons) {
  const rel = relTag(p);
  const r = commons.map(c => rankOf(c)).find(Boolean) || "";
  return `<div class="peer" data-peer="${esc(p.id)}">
    ${ava(p.name, p.id)}
    <div class="pbody">
      <div class="prow"><b>${esc(p.name)}</b>${rel ? `<span class="tagx">${rel}</span>` : ""}${r ? `<span class="rank ${rankCls(r)}">${esc(r)}</span>` : ""}</div>
      <div class="meta">${esc(deptLine(p))}</div>
      <div class="common">${esc(commonText(commons))}</div>
    </div>
    <span class="chev">›</span>
  </div>`;
}

function dmRow(t, names) {
  const uid = session.user.id;
  const oid = t.user_a === uid ? t.user_b : t.user_a;
  const nm = (names && names[oid]) || t.peer_name || "ユーザー";
  const msg = t.last_message || "（まだメッセージなし）";
  return `<div class="peer" data-tid="${esc(t.id)}">
    ${ava(nm, oid)}
    <div class="pbody">
      <div class="prow"><b>${esc(nm)}</b></div>
      <div class="dmline"><em>${esc(t.course_name || "")}</em>${t.course_name ? " ｜ " : ""}${esc(msg)}</div>
    </div>
    <span class="chev">›</span>
  </div>`;
}

function paintFilter() {
  const box = $("#sfilter"); if (!box) return;
  const items = [{ k: "all", n: "すべて" }].concat(myCourses.slice(0, 6).map(c => ({ k: norm(c.course_name), n: c.course_name })));
  if (courseFilter !== "all" && !items.some(i => i.k === courseFilter)) items.push({ k: courseFilter, n: courseFilter });
  box.innerHTML = items.map(i => `<button class="chip ghost ${courseFilter === i.k ? "on" : ""}" data-flt="${esc(i.k)}">${esc(i.n)}</button>`).join("");
  box.querySelectorAll("[data-flt]").forEach(b => b.onclick = () => { courseFilter = b.dataset.flt; paintFilter(); paintList(); });
}

function paintList() {
  const box = $("#slist"); if (!box) return;
  const q = norm(searchQ);
  let peers = groupPeers(boardCache.rows);
  if (courseFilter !== "all") peers = peers.filter(p => p.courses.some(c => norm(c.name) === courseFilter));
  if (q) peers = peers.filter(p => norm(p.name).includes(q) || p.courses.some(c => norm(c.name).includes(q)));
  peers = peers.filter(p => p.courses.length);
  peers.sort((a, b) => commonCourses(b).length - commonCourses(a).length || String(a.name).localeCompare(String(b.name), "ja"));
  if (!peers.length) {
    box.innerHTML = `<div class="empty">${myCourses.length ? "条件に合う人が見つかりませんでした。授業名や名前を変えてみてください。" : "先にマイページで授業を登録すると、同じ授業の人を探せます。"}</div>`;
    return;
  }
  box.innerHTML = peers.map(p => {
    const cs = commonCourses(p);
    return peerCard(p, cs);
  }).join("");
}

let threadsNames = {};
async function loadThreads() {
  const uid = session.user.id;
  const { data } = await sb.from("threads").select("*")
    .or(`user_a.eq.${uid},user_b.eq.${uid}`).order("last_message_at", { ascending: false, nullsFirst: false });
  const threads = data || [];
  const ids = [...new Set(threads.flatMap(t => [t.user_a, t.user_b]))].filter(id => id !== uid);
  threadsNames = {};
  if (ids.length) {
    const { data: ps } = await sb.from("profiles").select("id,display_name").in("id", ids);
    (ps || []).forEach(p => threadsNames[p.id] = p.display_name);
  }
  return threads;
}

  if (openTid) return rChat();
  paint(`<h1 class="hello" style="margin-bottom:14px">DM</h1>
  <div class="seg"><button id="seg_talk" class="${dmSeg === "talk" ? "on" : ""}">トーク</button><button id="seg_req" class="${dmSeg === "req" ? "on" : ""}">リクエスト</button></div>

async function rChat() {
  const uid = session.user.id;
  paint(`<div class="empty">読み込み中…</div>`);
  const { data: t } = await sb.from("threads").select("*").eq("id", openTid).single();
  if (!t) { openTid = null; render(); return; }
  const oid = t.user_a === uid ? t.user_b : t.user_a;
  const [{ data: p }, { data: msgs }] = await Promise.all([
    sb.from("profiles").select("*").eq("id", oid).single(),
    sb.from("messages").select("*").eq("thread_id", openTid).order("created_at")
  ]);
  const list = msgs || [];
  const nm = (p && p.display_name) || "ユーザー";
  paint(`
  <div class="chathead">
    <button class="backbtn" id="bk">‹</button>
    <div class="who"><b>${esc(nm)}</b><div class="meta">${esc(t.course_name || "")} ・ ${esc(p ? (splitDept(p.university, p.department).fac || "") : "")}</div></div>
    <button class="backbtn" id="pf" style="font-size:14px">›</button>
  </div>
  <div class="note" style="margin:0 0 6px">授業の進め方、課題、テスト対策などを相談できます。過去問そのものの転載は控えてください。</div>
  <div class="msgs" id="ms">${list.map(m => `<div class="m ${m.sender_id === uid ? "me" : ""}">${esc(m.body)}</div>`).join("") || `<div class="empty" style="text-align:center">まだメッセージはありません。最初のひとことを送ってみましょう。</div>`}</div>
  <div class="composer"><textarea id="tx" rows="1" placeholder="メッセージを入力…"></textarea><button class="send" id="sd">送信</button></div>`);
  const box = $("#ms"); if (box) box.scrollTop = box.scrollHeight;
  $("#pf").onclick = () => openPeerProfile(oid);
  $("#bk").onclick = () => { openTid = null; if (rtChannel) { sb.removeChannel(rtChannel); rtChannel = null; } render(); };
  $("#sd").onclick = async () => {
    const v = $("#tx").value.trim(); if (!v) return;
    const { error } = await sb.from("messages").insert({ thread_id: openTid, sender_id: uid, body: v });
    if (error) { alert("送信できませんでした: " + error.message); return; }
    render();
  };
  if (rtChannel) sb.removeChannel(rtChannel);
  rtChannel = sb.channel("dm-" + openTid)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "thread_id=eq." + openTid },
      payload => { if (payload.new.sender_id !== uid && openTid && tab === "dm") render(); })
    .subscribe();
}

async function startDM(otherId, course) {
  const uid = session.user.id;
  const [a, b] = [uid, otherId].sort();
  const { data, error } = await sb.from("threads")
    .upsert({ course_name: course, user_a: a, user_b: b }, { onConflict: "course_name,user_a,user_b" })
    .select().single();
  if (error) { alert("スレッドを作成できませんでした: " + error.message); return; }
  closeSheets();
  tab = "dm"; openTid = data.id; render();
}

const isFreeFac = (univ, fac) => !!fac && !facsOf(univ).some(f => f.n === fac);
const facFreeValue = (univ, fac) => (isFreeFac(univ, fac) ? fac : "");
function isFreeDep(univ, fac, dep) {
  if (!dep) return false;
  const ds = depsOf(univ, fac);
  return !ds.includes(dep);
}
const depFreeValue = (univ, fac, dep) => (isFreeDep(univ, fac, dep) ? dep : "");

function facOptions(univ, selected) {

  h += `<option value="__free"${isFreeFac(univ, selected) ? " selected" : ""}>その他（自由入力）</option>`;

}
function depOptions(univ, fac, selected) {
  const ds = depsOf(univ, fac);
  let h = `<option value="">${ds.length ? "学科を選択" : "（学科なし・自由入力可）"}</option>`;

  h += `<option value="__free"${isFreeDep(univ, fac, selected) ? " selected" : ""}>その他（自由入力）</option>`;

}

/* 授業候補：学部の専門科目 → 全学共通・語学 → 同じ大学の他ユーザーの登録 → 汎用 */
function courseCandidates(q) {
  const univ = univKey(curUniv || (myProfile && myProfile.university) || "");
  const registered = new Set((myCourses || []).map(c => norm(c.course_name)));
  const peers = new Map((hints.peers || []).map(p => [norm(p.name), p.count]));
  const out = [], seen = new Set();
  const push = (name, kind) => {
    const k = norm(name);
    if (!k || registered.has(k) || seen.has(k)) return;
    seen.add(k);
    out.push({ name, count: peers.get(k) || 0, kind });
  };
  const isRikkyo = univ.includes("立教");
  const allFacs = isRikkyo ? RIKKYO_FAC : (OTHER_FAC_COURSES[univ] || {});
  (allFacs[curFac] || []).forEach(n => push(n, curFac || "学部"));
  const common = isRikkyo ? RIKKYO_COMMON : GENERIC_COMMON;
  common.forEach(n => push(n, "全学共通"));
  (hints.peers || []).forEach(p => push(p.name, "登録済み"));
  const nq = norm(q);
  if (!nq) return out;
  /* 検索語があるときは他学部の科目も対象にする（自由入力の手がかり） */
  Object.keys(allFacs).forEach(fn => { if (fn !== curFac) (allFacs[fn] || []).forEach(n => push(n, fn)); });
  const head = [], tail = [];
  out.forEach(x => {
    const k = norm(x.name);
    if (k.startsWith(nq)) head.push(x);
    else if (k.includes(nq)) tail.push(x);
  });
  return head.concat(tail);
}

function drawCourseSuggest(q) {
  const list = $("#cnlist"); if (!list) return;
  const items = courseCandidates(q || "").slice(0, 8);
  if (!items.length) { hideSug("#cnlist"); return; }
  list.innerHTML = items.map(c => `<button type="button" class="sugitem" data-sug="${esc(c.name)}"><span class="nm">${esc(c.name)}</span>${c.count ? `<span class="cnt">${c.count}人が登録</span>` : `<span class="cnt d">${esc(c.kind)}</span>`}</button>`).join("");
  list.querySelectorAll("[data-sug]").forEach(b => b.onclick = () => {
    const inp = $("#cn"); if (!inp) return;
    inp.value = b.dataset.sug; hideSug("#cnlist");
  });
  list.classList.add("on");
}

async function loadCourseHints() {
  const univ = univKey((myProfile && myProfile.university) || "");
  const key = norm(univ);
  if (hints.key === key) return;
  hints = { key, univ, peers: [], loading: !!key };
  if (!key) return;
  const uid = session && session.user ? session.user.id : "";
  let data = [], error = null;
  try { ({ data, error } = await sb.from("peer_courses").select("course_name,university,user_id").limit(2000)); }
  catch (e) { error = e; }
  if (hints.key !== key) return;
  if (!error) {
    const m = new Map();
    (data || []).forEach(p => {
      if (!p || !p.course_name || p.user_id === uid) return;
      if (norm(p.university) !== key) return;
      const k = norm(p.course_name);
      let e = m.get(k);
      if (!e) { e = { name: String(p.course_name).trim(), users: new Set() }; m.set(k, e); }
      e.users.add(p.user_id);
    });
    hints.peers = [...m.values()]
      .sort((a, b) => b.users.size - a.users.size || a.name.localeCompare(b.name, "ja"))
      .map(e => ({ name: e.name, count: e.users.size }));
  }
  hints.loading = false;
  refreshCourseArea();
}

  if (!myProfile) await loadMine();
  if (hints.key !== norm((myProfile && myProfile.university) || "")) loadCourseHints();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  const map = { home: rHome, search: rSearch, dm: rDM, profile: rProfile };
  (map[tab] || rHome)();
}

/* ナビ */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  tab = b.dataset.t; openTid = null; editOpen = false; addOpen = false;
  closeSheets();
  window.scrollTo({ top: 0 });
  render();
});

/* 共通のデリゲート（相手カード・DM行） */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tid]");
  if (t) { openTid = t.dataset.tid; tab = "dm"; render(); return; }
  const p = e.target.closest("[data-peer]");
  if (p) { openPeerProfile(p.dataset.peer); return; }
});
document.addEventListener("pointerdown", e => {
  if (e.target && e.target.closest && (e.target.closest(".sugwrap"))) return;
  hideSug("#univlist");
});
$("#pmodal").addEventListener("click", e => { if (e.target.id === "pmodal") closeSheets(); });
$("#nmodal").addEventListener("click", e => { if (e.target.id === "nmodal") closeSheets(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheets(); });

/* 認証状態の変化 */
sb.auth.onAuthStateChange((event) => {
  myProfile = null;
  if (event === "PASSWORD_RECOVERY") {
    authMode = "recovery"; authErr = ""; authOk = ""; recoveryDone = false;
    setTimeout(render, 0);
  } else if (event === "SIGNED_IN" && authErr === SIGNUP_LINK_INVALID_MSG) {
    authErr = ""; setTimeout(render, 0);
  } else if (signupConfirmPending && (event === "SIGNED_IN" || event === "USER_UPDATED" || event === "INITIAL_SESSION")) {
    setTimeout(render, 0);
  }
});
function authLinkError() {
  const raw = decodeURIComponent(INIT_URL.hash + "&" + INIT_URL.search);
  if (!/error=/.test(raw)) return "";
  if (!/otp_expired|access_denied|invalid|expired/i.test(raw)) return "";
  if (/type=recovery/.test(raw) || getMailKind() === "recovery")
    return "再設定用のリンクが無効か、有効期限が切れています。「パスワードを忘れた方はこちら」からもう一度送信してください。";
  return SIGNUP_LINK_INVALID_MSG;
}
const linkErr = authLinkError();
if (linkErr) signupConfirmPending = false;
if (isRecoveryUrl()) { authMode = "recovery"; authErr = ""; authOk = ""; recoveryInvalid = false; }
else if (linkErr) { authMode = "login"; authErr = linkErr; authOk = ""; clearAuthUrl(); }

render();
</script>
</body>
</html>
